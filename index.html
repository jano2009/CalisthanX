<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7257f7">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%238b72ff'/%3E%3Cstop offset='1' stop-color='%235b3fe7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='20' fill='url(%23g)'/%3E%3Cg transform='rotate(-45 32 32)' fill='white'%3E%3Crect x='13' y='22' width='28' height='7' rx='4'/%3E%3Crect x='23' y='35' width='28' height='7' rx='4' opacity='.58'/%3E%3C/g%3E%3C/svg%3E">
  <title>Clastanic – Calisthenics Standards</title>
  <style>

    :root {
      --page: #0d0b15;
      --surface: #f4f3f7;
      --surface-2: #ebe9f0;
      --card: #ffffff;
      --card-soft: #f8f7fa;
      --ink: #111116;
      --ink-soft: #35343d;
      --muted: #777681;
      --muted-2: #aaa8b1;
      --line: #e3e1e8;
      --line-strong: #d4d1dc;
      --brand: #7257f7;
      --brand-2: #a889ff;
      --brand-deep: #4f35dc;
      --accent: #7257f7;
      --accent-deep: #352871;
      --success: #1fa675;
      --danger: #d84c57;
      --shadow-lg: 0 34px 100px rgba(5, 4, 12, .28);
      --shadow-card: 0 16px 38px rgba(29, 23, 62, .08);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 5%, rgba(125, 91, 255, .31), transparent 31rem),
        radial-gradient(circle at 86% 18%, rgba(176, 129, 255, .22), transparent 28rem),
        linear-gradient(145deg, #171224 0%, #0d0b15 48%, #08070d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.82), transparent 75%);
      content: "";
    }

    button,
    input { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(114, 87, 247, .28);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      width: min(1180px, calc(100% - 36px));
      min-height: calc(100vh - 36px);
      margin: 18px auto;
      padding: 0 30px max(58px, env(safe-area-inset-bottom));
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 36px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }

    .topbar,
    .detail-top {
      position: relative;
      z-index: 30;
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: max(15px, env(safe-area-inset-top)) 2px 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border-radius: 13px;
      background: linear-gradient(145deg, #8b72ff, #5b3fe7);
      box-shadow: 0 8px 18px rgba(91, 63, 231, .27);
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      width: 18px;
      height: 5px;
      border-radius: 999px;
      background: #fff;
      content: "";
      transform: rotate(-45deg);
    }

    .brand-mark::before { translate: -4px -4px; }
    .brand-mark::after { translate: 4px 4px; opacity: .58; }

    .brand-copy { line-height: 1; }

    .brand-name {
      display: block;
      font-size: 14px;
      font-weight: 820;
      letter-spacing: .095em;
    }

    .brand-sub {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .08em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-button,
    .quiet-button,
    .primary-button,
    .step-button,
    .back-button,
    .danger-button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink-soft);
      background: var(--card);
      box-shadow: 0 8px 22px rgba(31, 25, 62, .08);
      transition: transform .22s var(--ease), border-color .2s ease, box-shadow .2s ease;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      box-shadow: 0 12px 28px rgba(31, 25, 62, .13);
      transform: translateY(-2px);
    }

    .icon-button:active { transform: translateY(0) scale(.96); }
    .icon-button svg { width: 19px; height: 19px; }

    /* Home hero */
    .home-hero {
      --hero-rank-accent: var(--brand);
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr);
      min-height: 418px;
      align-items: stretch;
      gap: 28px;
      padding: 42px;
      overflow: hidden;
      border-radius: 32px;
      color: #fff;
      background:
        radial-gradient(circle at 82% 20%, rgba(255,255,255,.20), transparent 15rem),
        linear-gradient(135deg, #6d4ff2 0%, #805cf9 48%, #9f75ff 100%);
      box-shadow: 0 28px 54px rgba(90, 60, 215, .25);
    }

    .home-hero::before {
      position: absolute;
      width: 430px;
      height: 430px;
      right: -170px;
      bottom: -250px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      box-shadow:
        0 0 0 42px rgba(255,255,255,.045),
        0 0 0 88px rgba(255,255,255,.025);
      content: "";
    }

    .home-hero::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(90deg, rgba(0,0,0,.65), transparent 86%);
      content: "";
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: 8px 0;
    }

    .hero-eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;
      color: rgba(255,255,255,.86);
      background: rgba(255,255,255,.10);
      font-size: 10px;
      font-weight: 780;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .hero-eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 5px rgba(255,255,255,.12);
      content: "";
    }

    .home-hero h1 {
      max-width: 660px;
      margin: 24px 0 0;
      font-size: clamp(46px, 6.2vw, 76px);
      font-weight: 820;
      letter-spacing: -.062em;
      line-height: .93;
    }

    .home-hero h1 span {
      color: rgba(255,255,255,.62);
      font-weight: 690;
    }

    .hero-description {
      max-width: 560px;
      margin: 21px 0 0;
      color: rgba(255,255,255,.77);
      font-size: 14px;
      line-height: 1.65;
    }

    .hero-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .hero-metric {
      min-width: 128px;
      padding: 13px 15px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 17px;
      background: rgba(255,255,255,.10);
    }

    .hero-metric strong {
      display: block;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.025em;
      font-variant-numeric: tabular-nums;
    }

    .hero-metric span {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.64);
      font-size: 10px;
      font-weight: 650;
    }

    .overall-card {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 100%;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      padding: 24px;
      border: 0;
      border-radius: 28px;
      color: var(--ink);
      background: rgba(255,255,255,.96);
      box-shadow: 0 22px 46px rgba(47, 28, 124, .22);
      cursor: pointer;
      transition: transform .28s var(--ease), box-shadow .28s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .overall-card:hover {
      box-shadow: 0 28px 56px rgba(47, 28, 124, .28);
      transform: translateY(-4px) rotate(.25deg);
    }

    .overall-card:active { transform: translateY(-1px) scale(.985); }

    .overall-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 780;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .overall-card-arrow {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
    }

    .overall-card-arrow svg { width: 15px; height: 15px; }

    .overall-ring {
      position: relative;
      display: grid;
      width: 172px;
      height: 172px;
      align-self: center;
      margin: 8px 0;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 0 65%, transparent 66%),
        conic-gradient(var(--hero-rank-accent) var(--overall-progress, 0%), #ece9f3 0);
      box-shadow: inset 0 0 0 1px #ebe8f0;
    }

    .overall-ring::after {
      position: absolute;
      inset: 12px;
      border: 1px solid #eeebf3;
      border-radius: 50%;
      content: "";
    }

    .overall-ring-copy {
      position: relative;
      z-index: 1;
      display: flex;
      width: 124px;
      height: 124px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      text-align: center;
    }

    .overall-ring-copy small {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .overall-ring-copy strong {
      max-width: 105px;
      margin-top: 7px;
      overflow: hidden;
      color: var(--hero-rank-accent);
      font-size: 18px;
      font-weight: 820;
      letter-spacing: -.03em;
      line-height: 1.02;
      text-overflow: ellipsis;
    }

    .overall-card-foot {
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    /* Category navigation */
    .exercise-section { padding-top: 30px; }

    .clean-tabs-wrap {
      position: relative;
      overflow: visible;
    }

    .clean-tabs {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
      min-width: 0;
      gap: 4px;
      padding: 5px;
      overflow: hidden;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(135deg, #6a4fee, #8060f7);
      box-shadow: 0 16px 32px rgba(92, 61, 220, .18);
      isolation: isolate;
    }

    .clean-tabs::before {
      position: absolute;
      z-index: 0;
      top: 5px;
      bottom: 5px;
      left: 5px;
      width: calc((100% - 22px) / 4);
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(47, 31, 115, .22);
      content: "";
      transform: translateX(var(--tab-slide, 0px));
      transition: transform .38s var(--ease);
      will-change: transform;
    }

    .clean-tab {
      position: relative;
      z-index: 1;
      min-height: 54px;
      padding: 0 14px;
      border: 0;
      border-radius: 17px;
      color: rgba(255,255,255,.73);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 710;
      letter-spacing: -.01em;
      transition: color .22s ease, transform .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .clean-tab:hover { color: #fff; }
    .clean-tab:active { transform: scale(.97); }
    .clean-tab.active { color: var(--ink); }

    .clean-section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 34px 4px 17px;
    }

    .clean-section-head > div { min-width: 0; }

    .clean-section-head h2 {
      margin: 7px 0 0;
      font-size: 31px;
      font-weight: 790;
      letter-spacing: -.045em;
    }

    .clean-section-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .category-count {
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.62);
      font-size: 10px;
      font-weight: 720;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      animation: gridIn .36s var(--ease) both;
    }

    .exercise-grid.tab-enter { animation: tabContentIn .32s var(--ease) both; }

    @keyframes gridIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tabContentIn {
      from { opacity: .15; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .exercise-card {
      --card-accent: var(--brand);
      --art-accent: var(--card-accent);
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 58px 42px;
      min-height: 148px;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 13px 14px 13px 13px;
      border: 1px solid rgba(218, 215, 226, .84);
      border-radius: 24px;
      color: var(--ink);
      background: var(--card);
      box-shadow: var(--shadow-card);
      text-align: left;
      cursor: pointer;
      transition: transform .28s var(--ease), box-shadow .25s ease, border-color .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .exercise-card:hover {
      border-color: color-mix(in srgb, var(--card-accent) 28%, var(--line-strong));
      box-shadow: 0 23px 48px rgba(31, 24, 67, .13);
      transform: translateY(-4px);
    }

    .exercise-card:active { transform: translateY(-1px) scale(.992); }

    .art-panel {
      position: relative;
      display: grid;
      width: 112px;
      height: 120px;
      place-items: center;
      overflow: hidden;
      border-radius: 20px;
      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,.94), transparent 32%),
        linear-gradient(145deg, color-mix(in srgb, var(--art-accent) 18%, #f6f5fa), #eeecf3);
    }

    .art-panel::before {
      position: absolute;
      width: 90px;
      height: 90px;
      right: -42px;
      bottom: -42px;
      border: 1px solid color-mix(in srgb, var(--art-accent) 28%, transparent);
      border-radius: 50%;
      box-shadow: 0 0 0 18px color-mix(in srgb, var(--art-accent) 7%, transparent);
      content: "";
    }

    .art-panel::after {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--art-accent);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--art-accent) 12%, transparent);
      content: "";
    }

    .exercise-art {
      position: relative;
      z-index: 1;
      display: block;
      width: 106px;
      height: 106px;
      object-fit: cover;
      object-position: center;
      overflow: hidden;
      border-radius: 17px;
      background: #fff;
      transition: transform .28s var(--ease);
    }

    .exercise-card:hover .exercise-art { transform: scale(1.035); }

    .card-main { min-width: 0; }

    .card-meta-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-kicker {
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .card-status {
      flex: 0 0 auto;
      padding: 5px 7px;
      border-radius: 999px;
      color: var(--card-accent);
      background: color-mix(in srgb, var(--card-accent) 10%, #fff);
      font-size: 8px;
      font-weight: 780;
      letter-spacing: .03em;
    }

    .card-title {
      display: block;
      margin-top: 8px;
      overflow: hidden;
      font-size: 18px;
      font-weight: 770;
      letter-spacing: -.03em;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 11px;
    }

    .rank-label {
      overflow: hidden;
      color: var(--card-accent);
      font-size: 10px;
      font-weight: 780;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .value-label {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .mini-progress {
      display: block;
      width: 100%;
      height: 5px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: #eceaf0;
    }

    .mini-progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--card-accent), color-mix(in srgb, var(--card-accent) 55%, #ffffff));
      transition: width .42s var(--ease);
    }

    .card-badge {
      display: grid;
      place-items: center;
    }

    .card-arrow {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      transition: transform .25s var(--ease), background .2s ease;
    }

    .exercise-card:hover .card-arrow {
      background: var(--card-accent);
      transform: translateX(3px);
    }

    .card-arrow svg { width: 17px; height: 17px; }

    .empty-state {
      grid-column: 1 / -1;
      padding: 50px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: 24px;
      color: var(--muted);
      background: rgba(255,255,255,.48);
      text-align: center;
    }

    /* Rank badge – 13 eigenständige, aufeinander aufbauende Abzeichen */
    .rank-badge {
      display: block;
      overflow: visible;
      isolation: isolate;
      filter: drop-shadow(0 9px 16px rgba(24, 18, 48, .18));
    }

    .rank-badge .rank-progress-bg {
      fill: none;
      stroke: #e5e2ea;
      stroke-width: 4;
    }

    .rank-badge .rank-progress {
      fill: none;
      stroke: var(--rank-accent);
      stroke-width: 4;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 64px 64px;
      transition: stroke-dashoffset .45s var(--ease), stroke .25s ease;
    }

    .rank-badge .rank-tick {
      stroke: rgba(34, 29, 49, .16);
      stroke-width: 1.8;
      stroke-linecap: round;
    }

    .rank-badge .rank-shell {
      stroke: rgba(255,255,255,.28);
      stroke-width: 1.35;
      stroke-linejoin: round;
    }

    .rank-badge .rank-shell-edge {
      fill: none;
      stroke: var(--rank-accent);
      stroke-width: 1.7;
      stroke-linejoin: round;
      opacity: .9;
    }

    .rank-badge .rank-shell-glow {
      fill: none;
      stroke: rgba(255,255,255,.16);
      stroke-width: 1;
      stroke-linejoin: round;
    }

    .rank-badge .rank-facet {
      fill: rgba(255,255,255,.055);
      pointer-events: none;
    }

    .rank-badge .rank-core {
      fill: rgba(255,255,255,.045);
      stroke: rgba(255,255,255,.10);
      stroke-width: 1;
    }

    .rank-badge .rank-emblem-wrap {
      transform-origin: 64px 58px;
      transition: transform .28s var(--ease);
    }

    .rank-badge .rank-emblem {
      fill: none;
      stroke: #fff;
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rank-badge .rank-emblem-soft {
      fill: none;
      stroke: var(--rank-accent);
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rank-badge .rank-emblem-fine {
      fill: none;
      stroke: rgba(255,255,255,.62);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rank-badge .rank-emblem-fill { fill: #fff; }
    .rank-badge .rank-emblem-accent { fill: var(--rank-accent); }

    .rank-badge .rank-level-plate {
      fill: rgba(7, 7, 13, .30);
      stroke: rgba(255,255,255,.08);
      stroke-width: 1;
    }

    .rank-badge .rank-number {
      fill: rgba(255,255,255,.66);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 7px;
      font-weight: 850;
      letter-spacing: 1.25px;
      text-anchor: middle;
    }

    /* In den kleinen Übungskarten bleibt das Abzeichen bewusst ruhiger. */
    .card-badge .rank-level-plate,
    .card-badge .rank-number {
      display: none;
    }

    .rank-grid-item:hover .rank-emblem-wrap {
      transform: translateY(-1.5px) scale(1.035);
    }

    .rank-grid-item.active .rank-badge {
      filter:
        drop-shadow(0 9px 16px rgba(24, 18, 48, .16))
        drop-shadow(0 0 12px color-mix(in srgb, var(--item-accent) 28%, transparent));
    }

    /* Detail page */
    .detail-view { animation: pageIn .4s var(--ease) both; }

    @keyframes pageIn {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .detail-top {
      min-height: 78px;
      padding-bottom: 13px;
    }

    .back-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      padding: 0 15px 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      background: var(--card);
      box-shadow: 0 8px 20px rgba(31,25,62,.07);
      font-size: 12px;
      font-weight: 700;
      transition: transform .22s var(--ease), box-shadow .2s ease;
    }

    .back-button:hover {
      box-shadow: 0 12px 25px rgba(31,25,62,.11);
      transform: translateX(-3px);
    }

    .back-button svg { width: 16px; height: 16px; }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(330px, .82fr);
      gap: 16px;
      align-items: stretch;
    }

    .detail-art-card {
      --detail-accent: var(--brand);
      position: relative;
      min-height: 500px;
      overflow: hidden;
      border-radius: 32px;
      color: #fff;
      background:
        radial-gradient(circle at 78% 24%, rgba(255,255,255,.22), transparent 14rem),
        linear-gradient(145deg, var(--detail-accent), color-mix(in srgb, var(--detail-accent) 62%, #6d4ff2));
      box-shadow: 0 28px 54px color-mix(in srgb, var(--detail-accent) 24%, transparent);
    }

    .detail-art-card::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.66), transparent 92%);
      content: "";
    }

    .detail-art-card::after {
      position: absolute;
      width: 330px;
      height: 330px;
      right: -135px;
      bottom: -170px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 50%;
      box-shadow: 0 0 0 46px rgba(255,255,255,.045), 0 0 0 92px rgba(255,255,255,.025);
      content: "";
    }

    .detail-heading {
      position: relative;
      z-index: 2;
      padding: 38px 38px 0;
    }

    .detail-category-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;
      color: rgba(255,255,255,.86);
      background: rgba(255,255,255,.10);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .detail-category-chip::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      content: "";
    }

    .detail-heading h1 {
      max-width: 690px;
      margin: 20px 0 0;
      font-size: clamp(42px, 5vw, 66px);
      font-weight: 820;
      letter-spacing: -.058em;
      line-height: .95;
    }

    .detail-heading p {
      margin: 15px 0 0;
      color: rgba(255,255,255,.72);
      font-size: 13px;
    }

    .detail-art-stage {
      position: absolute;
      z-index: 1;
      inset: 155px 20px 15px;
      display: grid;
      place-items: center;
    }

    .detail-art-stage .exercise-art {
      width: min(330px, 90%);
      height: min(330px, 100%);
      max-height: none;
      object-fit: cover;
      object-position: center;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 24px 44px rgba(44, 24, 117, .28);
      filter: none;
    }

    .detail-side {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-card,
    .input-card,
    .threshold-card {
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }

    .rank-card {
      --detail-accent: var(--brand);
      display: grid;
      min-height: 238px;
      grid-template-columns: 132px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 24px 22px;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 15% 22%, color-mix(in srgb, var(--detail-accent) 10%, transparent), transparent 12rem),
        #fff;
    }

    #detail-badge { width: 128px; max-width: 100%; }
    #detail-badge .rank-badge { width: 100%; height: auto; }

    .rank-card-copy { min-width: 0; }

    .rank-card-kicker,
    .input-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .rank-card-name {
      margin-top: 8px;
      color: var(--detail-accent);
      font-size: 24px;
      font-weight: 820;
      letter-spacing: -.04em;
      line-height: 1;
    }

    .rank-card-text {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 17px;
      overflow: hidden;
      border-radius: 999px;
      background: #eceaf0;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--progress-color, var(--detail-accent));
      transition: width .45s var(--ease), background .25s ease;
    }

    .input-card {
      flex: 1;
      padding: 25px;
      border-radius: 28px;
    }

    .input-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .big-value {
      margin-top: 9px;
      font-size: clamp(35px, 4vw, 48px);
      font-weight: 820;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }

    .stepper {
      display: flex;
      gap: 8px;
    }

    .step-button {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: var(--card-soft);
      font-size: 20px;
      font-weight: 600;
      transition: color .2s ease, background .2s ease, transform .18s ease;
    }

    .step-button:hover {
      color: #fff;
      background: var(--ink);
      transform: translateY(-2px);
    }

    .range-wrap { margin-top: 27px; }

    input[type="range"] {
      width: 100%;
      height: 9px;
      margin: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--slider-accent) var(--slider-progress), #ebe9ef var(--slider-progress));
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 28px;
      height: 28px;
      border: 6px solid #fff;
      border-radius: 50%;
      background: var(--slider-accent);
      box-shadow: 0 5px 18px color-mix(in srgb, var(--slider-accent) 35%, transparent), 0 0 0 1px rgba(31,28,43,.08);
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 6px solid #fff;
      border-radius: 50%;
      background: var(--slider-accent);
      box-shadow: 0 5px 18px color-mix(in srgb, var(--slider-accent) 35%, transparent), 0 0 0 1px rgba(31,28,43,.08);
    }

    .range-meta {
      display: grid;
      grid-template-columns: 1fr 102px 1fr;
      align-items: center;
      gap: 12px;
      margin-top: 19px;
    }

    .range-meta > span {
      color: var(--muted-2);
      font-size: 10px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .range-meta > span:last-child { text-align: right; }

    .number-field {
      width: 102px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--card-soft);
      text-align: center;
      font-size: 14px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .number-field::-webkit-inner-spin-button,
    .number-field::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .autosave-note {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 19px;
      color: var(--muted);
      font-size: 10px;
    }

    .autosave-note::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(31,166,117,.10);
      content: "";
    }

    .detail-bottom {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .threshold-card {
      padding: 29px;
      border-radius: 30px;
    }

    .journey-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 22px;
    }

    .journey-head h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .journey-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .journey-head::after {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--card-soft);
      font-size: 9px;
      font-weight: 720;
      content: "13 Level";
    }

    .threshold-list {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 9px;
    }

    .threshold {
      min-width: 0;
      padding: 14px 8px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card-soft);
      text-align: center;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .threshold.reached {
      border-color: color-mix(in srgb, var(--threshold-accent) 30%, var(--line));
      background: color-mix(in srgb, var(--threshold-accent) 7%, #fff);
    }

    .threshold.current {
      color: #fff;
      border-color: var(--threshold-accent);
      background: var(--threshold-accent);
      box-shadow: 0 10px 22px color-mix(in srgb, var(--threshold-accent) 25%, transparent);
      transform: translateY(-2px);
    }

    .threshold-rank {
      overflow: hidden;
      color: var(--muted);
      font-size: 8px;
      font-weight: 740;
      letter-spacing: .02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .threshold.current .threshold-rank { color: rgba(255,255,255,.76); }

    .threshold-value {
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
    }

    .threshold.current .threshold-value { color: #fff; }

    /* Modals */
    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(10, 8, 18, .72);
      backdrop-filter: blur(14px);
      animation: fade .22s ease both;
    }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .modal-panel {
      width: min(980px, 100%);
      max-height: min(820px, calc(100vh - 36px));
      overflow: auto;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: 0 38px 110px rgba(0,0,0,.45);
      animation: modalIn .3s var(--ease) both;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-head {
      position: sticky;
      z-index: 2;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 25px 27px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 810;
      letter-spacing: -.04em;
    }

    .modal-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 20px;
    }

    .rank-grid-item {
      display: flex;
      min-height: 176px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 10px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      text-align: center;
      transition: transform .22s var(--ease), box-shadow .2s ease;
    }

    .rank-grid-item:hover {
      box-shadow: var(--shadow-card);
      transform: translateY(-3px);
    }

    .rank-grid-item:last-child {
      grid-column: 2 / span 2;
      width: calc(50% - 6px);
      justify-self: center;
    }

    .rank-grid-item.active {
      border-color: color-mix(in srgb, var(--item-accent) 42%, var(--line));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--item-accent) 18%, transparent), var(--shadow-card);
    }

    .rank-grid-name {
      margin-top: 9px;
      color: var(--item-accent);
      font-size: 11px;
      font-weight: 820;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .rank-grid-level {
      margin-top: 4px;
      color: var(--muted-2);
      font-size: 9px;
      font-weight: 680;
    }

    /* Reset dialog */
    .reset-panel {
      width: min(440px, 100%);
      max-height: none;
      overflow: hidden;
    }

    .reset-body {
      padding: 34px 30px 24px;
      text-align: center;
    }

    .reset-symbol {
      display: grid;
      width: 60px;
      height: 60px;
      margin: 0 auto 19px;
      place-items: center;
      border-radius: 19px;
      color: var(--danger);
      background: rgba(216,76,87,.10);
    }

    .reset-symbol svg { width: 25px; height: 25px; }

    .reset-body h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 810;
      letter-spacing: -.04em;
    }

    .reset-body p {
      max-width: 350px;
      margin: 11px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .reset-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .quiet-button,
    .primary-button,
    .danger-button {
      min-height: 46px;
      padding: 0 18px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 760;
      transition: transform .2s var(--ease), box-shadow .2s ease, background .2s ease;
    }

    .quiet-button {
      border: 1px solid var(--line);
      color: var(--ink-soft);
      background: var(--card);
    }

    .primary-button {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 10px 22px rgba(114,87,247,.22);
    }

    .danger-button {
      color: #fff;
      background: var(--danger);
      box-shadow: 0 10px 22px rgba(216,76,87,.20);
    }

    .quiet-button:hover,
    .primary-button:hover,
    .danger-button:hover { transform: translateY(-2px); }

    .app-toast {
      position: fixed;
      z-index: 140;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      translate: -50% 14px;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #fff;
      background: rgba(22, 19, 31, .94);
      box-shadow: 0 18px 55px rgba(0,0,0,.36);
      font-size: 12px;
      font-weight: 680;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, translate .22s ease;
    }

    .app-toast.visible { opacity: 1; translate: -50% 0; }

    .footer-note {
      padding: 36px 8px 0;
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 1020px) {
      .home-hero { grid-template-columns: minmax(0, 1fr) 280px; padding: 34px; }
      .home-hero h1 { font-size: clamp(45px, 7vw, 66px); }
      .exercise-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-art-card { min-height: 430px; }
      .detail-side { display: grid; grid-template-columns: 1fr 1fr; }
      .threshold-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      body { background: var(--surface); }
      body::before { display: none; }

      .app {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding-right: max(15px, env(safe-area-inset-right));
        padding-left: max(15px, env(safe-area-inset-left));
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .topbar,
      .detail-top {
        min-height: 72px;
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .brand-sub { display: none; }
      .brand-name { font-size: 13px; }
      .brand-mark { width: 35px; height: 35px; border-radius: 12px; }
      .icon-button { width: 42px; height: 42px; }

      .home-hero {
        grid-template-columns: 1fr;
        min-height: auto;
        gap: 24px;
        padding: 28px 22px 22px;
        border-radius: 28px;
      }

      .home-hero h1 {
        margin-top: 20px;
        font-size: clamp(44px, 13vw, 60px);
      }

      .hero-description { font-size: 13px; }
      .hero-metrics { gap: 8px; margin-top: 23px; }
      .hero-metric { min-width: 0; flex: 1; padding: 12px 13px; }

      .overall-card {
        display: grid;
        min-height: 176px;
        grid-template-columns: minmax(0, 1fr) 132px;
        grid-template-rows: auto 1fr;
        align-items: center;
        gap: 8px 16px;
        padding: 19px;
        border-radius: 24px;
      }

      .overall-card-top { grid-column: 1 / -1; }
      .overall-ring { grid-column: 2; grid-row: 2; width: 126px; height: 126px; margin: 0; }
      .overall-ring-copy { width: 92px; height: 92px; }
      .overall-ring-copy strong { max-width: 80px; font-size: 15px; }
      .overall-card-foot { grid-column: 1; grid-row: 2; padding: 0; border: 0; text-align: left; }

      .exercise-section { padding-top: 22px; }
      .clean-tabs { border-radius: 20px; }
      .clean-tabs::before { border-radius: 15px; }
      .clean-tab { min-height: 50px; padding: 0 7px; border-radius: 15px; font-size: 12px; }

      .clean-section-head { margin: 28px 3px 14px; }
      .clean-section-head h2 { font-size: 27px; }
      .clean-section-head p { display: none; }
      .category-count { padding: 8px 10px; }

      .exercise-card {
        grid-template-columns: 96px minmax(0, 1fr) 52px 40px;
        min-height: 132px;
        gap: 12px;
        padding: 11px;
        border-radius: 22px;
      }

      .art-panel { width: 96px; height: 108px; border-radius: 18px; }
      .exercise-art { width: 93px; height: 93px; }
      .card-title { font-size: 17px; }
      .card-arrow { width: 40px; height: 40px; }

      .detail-top .brand { display: none; }
      .detail-grid { gap: 14px; }
      .detail-art-card { min-height: 390px; border-radius: 28px; }
      .detail-heading { padding: 29px 24px 0; }
      .detail-heading h1 { font-size: clamp(40px, 12vw, 56px); }
      .detail-art-stage { inset: 145px 6px 8px; }
      .detail-side { display: flex; }
      .rank-card, .input-card { border-radius: 25px; }
      .threshold-card { padding: 24px 17px; border-radius: 26px; }
      .journey-head h2 { font-size: 23px; }
      .threshold-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }

      .rank-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px; }
      .rank-grid-item { min-height: 152px; border-radius: 19px; }
      .rank-grid-item:last-child { grid-column: 2; width: 100%; }
      .modal { padding: 8px; }

    .art-panel > .exercise-art {

    /* Die weiße PNG-Fläche wirkt jetzt wie eine absichtlich gesetzte
       Posterkarte in der rechten unteren Ecke – nicht mehr wie ein
       zufällig auf den violetten Hintergrund gelegtes Quadrat. */
    .detail-art-stage {
      position: absolute;
      z-index: 3;
      inset: auto -24px -24px auto;
      display: block;
      width: clamp(215px, 46%, 340px);
      height: auto;
      aspect-ratio: 1;
      pointer-events: none;
      transform: rotate(-1.5deg);
      transform-origin: 100% 100%;
    }

    .detail-art-stage::before {
      position: absolute;
      z-index: -1;
      inset: 13px 18px 18px -18px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 34px;
      background: rgba(255, 255, 255, .105);
      box-shadow: 0 22px 48px rgba(45, 26, 124, .16);
      content: "";
      transform: rotate(4deg);
    }

    .detail-art-stage .exercise-art {
      display: block;
      width: 100%;
      height: 100%;
      max-height: none;
      border: 8px solid #fff;
      border-radius: 32px;
      outline: 1px solid rgba(255, 255, 255, .48);
      object-fit: cover;
      object-position: center;
      background: #fff;
      box-shadow:
        0 32px 64px rgba(43, 24, 116, .34),
        0 8px 20px rgba(43, 24, 116, .18);
      filter: none;
      transform: none;
    }

    /* Switch selbst */
    .theme-toggle {
      position: relative;
      display: inline-grid;
      width: 54px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      box-shadow: 0 8px 22px rgba(31,25,62,.08);
      cursor: pointer;
      transition: background .28s var(--ease), border-color .28s ease, box-shadow .28s ease, transform .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:hover { transform: translateY(-1px); }
    .theme-toggle:active { transform: scale(.96); }

    .theme-toggle-track {
      position: absolute;
      inset: 4px;
      overflow: hidden;
      border-radius: inherit;
      background: #eeedf2;
      transition: background .32s var(--ease);
    }

    .theme-toggle-thumb {
      position: absolute;
      z-index: 2;
      top: 5px;
      left: 5px;
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 50%;
      color: #7257f7;
      background: #fff;
      box-shadow: 0 4px 12px rgba(31,25,62,.18);
      transform: translateX(0);
      transition: transform .38s var(--ease), color .28s ease, background .28s ease, box-shadow .28s ease;
    }

    .theme-toggle-thumb svg {
      position: absolute;
      width: 12px;
      height: 12px;
      transition: opacity .22s ease, transform .32s var(--ease);
    }

    .theme-sun { opacity: 1; transform: scale(1) rotate(0deg); }
    .theme-moon { opacity: 0; transform: scale(.55) rotate(-35deg); }

    html[data-theme="dark"] .theme-toggle {
      border-color: #303541;
      background: #171a22;
      box-shadow: 0 8px 22px rgba(0,0,0,.22);
    }

    html[data-theme="dark"] .theme-toggle-track { background: #252a34; }

    html[data-theme="dark"] .theme-toggle-thumb {
      color: #d7ccff;
      background: #7257f7;
      box-shadow: 0 5px 14px rgba(114,87,247,.32);
      transform: translateX(20px);
    }

    html[data-theme="dark"] .theme-sun { opacity: 0; transform: scale(.55) rotate(45deg); }
    html[data-theme="dark"] .theme-moon { opacity: 1; transform: scale(1) rotate(0deg); }

    @media (max-width: 520px) {
      .theme-toggle { width: 50px; height: 32px; }
      .theme-toggle-thumb { width: 20px; height: 20px; top: 5px; left: 5px; }
      html[data-theme="dark"] .theme-toggle-thumb { transform: translateX(18px); }
    }


    /* ===== Archetype · Journey · Road to Apex · Cinematic Rank Up ===== */
    .archetype-pill{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card-soft);font-size:8px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
    .archetype-pill i{width:6px;height:6px;border-radius:50%;background:var(--archetype);box-shadow:0 0 0 4px color-mix(in srgb,var(--archetype) 12%,transparent)}
    .journey-card,.apex-road-card{grid-column:1/-1;padding:27px}
    .system-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:20px}
    .system-head h2{margin:5px 0 0;font-size:25px;letter-spacing:-.04em}
    .journey-line{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
    .journey-stage{position:relative;padding:15px 8px 13px;border:1px solid var(--line);border-radius:17px;background:var(--card-soft);text-align:center;overflow:hidden}
    .journey-stage::before{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--stage);opacity:.16;content:""}
    .journey-stage.done::before,.journey-stage.current::before{opacity:1}
    .journey-stage.current{border-color:color-mix(in srgb,var(--stage) 42%,var(--line));box-shadow:0 10px 25px color-mix(in srgb,var(--stage) 12%,transparent);transform:translateY(-2px)}
    .journey-dot{display:grid;width:30px;height:30px;margin:0 auto 9px;place-items:center;border-radius:50%;color:var(--muted);background:var(--card);border:1px solid var(--line);font-size:9px;font-weight:850}
    .journey-stage.done .journey-dot,.journey-stage.current .journey-dot{color:#fff;background:var(--stage);border-color:var(--stage)}
    .journey-name{font-size:9px;font-weight:820}.journey-state{margin-top:4px;color:var(--muted);font-size:7px}
    .apex-road-card{position:relative;color:#fff;background:linear-gradient(135deg,#171321,#2a2046 58%,#7257f7);overflow:hidden}
    .apex-road-card::after{position:absolute;width:300px;height:300px;right:-130px;top:-165px;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 45px rgba(255,255,255,.025),0 0 0 92px rgba(255,255,255,.015);content:""}
    .apex-road-main{position:relative;z-index:1;display:grid;grid-template-columns:160px 1fr;gap:26px;align-items:center}
    .apex-percent{font-size:55px;font-weight:880;letter-spacing:-.065em;line-height:.9}.apex-percent span{display:block;margin-top:12px;color:rgba(255,255,255,.5);font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .apex-copy h2{margin:5px 0 0;font-size:28px;letter-spacing:-.045em}.apex-copy p{margin:8px 0 0;color:rgba(255,255,255,.62);font-size:11px;line-height:1.5}
    .apex-track{height:8px;margin-top:19px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.12)}.apex-track span{display:block;height:100%;border-radius:inherit;background:#fff;box-shadow:0 0 18px rgba(255,255,255,.35)}
    .rankup-panel{position:relative}.rankup-panel::before{position:absolute;inset:-80px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--rankup-accent) 32%,transparent),transparent 34%);content:"";animation:rankAura 1.4s ease both;pointer-events:none}
    .rankup-badge{position:relative}.rankup-badge::after{position:absolute;inset:4%;border:1px solid color-mix(in srgb,var(--rankup-accent) 65%,#fff);border-radius:50%;content:"";animation:rankPulse 1.15s ease-out both;pointer-events:none}
    .rankup-meta{margin:18px auto 0;padding:11px 13px;max-width:290px;border:1px solid rgba(255,255,255,.10);border-radius:14px;color:rgba(255,255,255,.58);background:rgba(255,255,255,.045);font-size:9px;font-weight:700}
    @keyframes rankAura{0%{opacity:0;transform:scale(.55)}45%{opacity:1}100%{opacity:.45;transform:scale(1.15)}}
    @keyframes rankPulse{0%{opacity:0;transform:scale(.5)}45%{opacity:.9}100%{opacity:0;transform:scale(1.55)}}
    html[data-theme="dark"] .archetype-pill,html[data-theme="dark"] .journey-stage{background:var(--card-soft);border-color:var(--line)}
    @media(max-width:760px){.journey-card,.apex-road-card{grid-column:auto}.journey-line{grid-template-columns:repeat(4,1fr)}.apex-road-main{grid-template-columns:1fr}.apex-percent{font-size:48px}}

    /* ===== Bottom App Navigation ===== */
    .app.with-bottom-nav { padding-bottom: max(112px, calc(92px + env(safe-area-inset-bottom))); }
    .bottom-nav-shell {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      width: min(520px, calc(100% - 32px));
      transform: translateX(-50%);
      pointer-events: none;
    }
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 24px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 18px 48px rgba(23,18,48,.18);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      pointer-events: auto;
    }
    .bottom-nav-button {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 0;
      border-radius: 18px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 760;
      transition: color .2s ease, background .25s var(--ease), transform .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .bottom-nav-button svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .bottom-nav-button:hover { color: var(--ink); background: var(--card-soft); }
    .bottom-nav-button:active { transform: scale(.97); }
    .bottom-nav-button.active {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #8b72ff);
      box-shadow: 0 8px 18px rgba(114,87,247,.24);
    }

    /* ===== Fortschritt-Ansicht ===== */
    /* Tab-Seiten dürfen keinen transformierten Elterncontainer haben:
       position: fixed der Bottom-Navigation bleibt dadurch wirklich am Viewport. */
    .tab-page { animation: tabPageFadeIn .35s ease both; }

    @keyframes tabPageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .tab-page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 4px 20px;
    }
    .tab-page-head h1 { margin: 6px 0 0; font-size: clamp(34px,5vw,48px); font-weight: 840; letter-spacing: -.055em; }
    .tab-page-head p { max-width: 620px; margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .progress-overview { display: grid; gap: 18px; }
    .progress-category { padding: 24px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); box-shadow: var(--shadow-card); }
    .progress-category-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:15px; }
    .progress-category-title { font-size: 22px; font-weight: 820; letter-spacing: -.04em; }
    .progress-category-meta { margin-top:5px; color:var(--muted); font-size:10px; }
    .progress-list { display:grid; gap:9px; }
    .progress-row {
      --row-accent: var(--brand);
      display:grid;
      grid-template-columns: 1fr auto;
      gap:14px;
      align-items:center;
      padding:14px 15px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--card-soft);
      cursor:pointer;
      transition:transform .2s var(--ease),border-color .2s ease,background .2s ease;
    }
    .progress-row:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--row-accent) 30%,var(--line)); }
    .progress-row-main { min-width:0; }
    .progress-row-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .progress-row-name { overflow:hidden; font-size:14px; font-weight:790; text-overflow:ellipsis; white-space:nowrap; }
    .progress-row-value { flex:0 0 auto; color:var(--muted); font-size:10px; font-weight:720; }
    .progress-row-rank { margin-top:5px; color:var(--row-accent); font-size:10px; font-weight:800; }
    .progress-row-bar { height:5px; margin-top:10px; overflow:hidden; border-radius:99px; background:#e7e5eb; }
    .progress-row-bar span { display:block; height:100%; border-radius:inherit; background:var(--row-accent); }
    .progress-row-next { display:grid; width:34px; height:34px; place-items:center; border-radius:50%; color:var(--ink); background:var(--card); border:1px solid var(--line); }
    .progress-row-next svg { width:14px; height:14px; }

    /* ===== Profil-Ansicht ===== */
    .profile-page-grid { display:block; }
    .athlete-profile-shell { display:grid; gap:16px; }
    .athlete-profile-hero {
      --profile-accent: var(--brand);
      position:relative;
      min-height:390px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 260px;
      align-items:center;
      gap:30px;
      padding:42px;
      overflow:hidden;
      border-radius:34px;
      color:#fff;
      background:
        radial-gradient(circle at 82% 18%,color-mix(in srgb,var(--profile-accent) 44%,transparent),transparent 18rem),
        linear-gradient(140deg,#171321 0%,#211936 48%,color-mix(in srgb,var(--profile-accent) 70%,#171321) 100%);
      box-shadow:0 30px 65px color-mix(in srgb,var(--profile-accent) 22%,rgba(20,15,40,.24));

      function applyTheme(theme, persist = false) {

        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", next === "dark" ? "#11131a" : "#7257f7");

        document.querySelectorAll(".theme-toggle").forEach(button => {
          const isDark = next === "dark";
          button.setAttribute("aria-pressed", String(isDark));

      function isAppStorageKey(key) {
        return typeof key === "string" && (
          key === STORAGE_KEY ||
          LEGACY_STORAGE_KEYS.includes(key) ||
          key.startsWith(`${STORAGE_PREFIX}-`)
        );
      }

      function clearStorageArea(storage, includeCurrent = true) {
        try {
          for (let index = storage.length - 1; index >= 0; index -= 1) {
            const key = storage.key(index);
            if (!isAppStorageKey(key)) continue;
            if (!includeCurrent && key === STORAGE_KEY) continue;
            storage.removeItem(key);
          }
        } catch (_) {}
      }

      function clearLegacyStorage() {
        // Frühere Versionen dürfen den Startzustand dieser Datei nicht beeinflussen.
        clearStorageArea(localStorage, false);
        clearStorageArea(sessionStorage, false);
      }

      function clearAllStoredValues() {
        clearStorageArea(localStorage, true);
        clearStorageArea(sessionStorage, true);
      }

      function sanitizeValues(candidate) {
        const clean = {};
        if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return clean;

        const validIds = new Set(ALL_EXERCISES.map(exercise => exercise.id));
        Object.entries(candidate).forEach(([id, rawValue]) => {
          if (!validIds.has(id)) return;
          const value = Math.max(0, Math.round(Number(rawValue) || 0));
          clean[id] = value;
        });
        return clean;
      }

      function loadValues() {
        clearLegacyStorage();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return {};
          return sanitizeValues(JSON.parse(raw));
        } catch (_) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
          return {};
        }
      }

      function saveValues() {
        state.values = sanitizeValues(state.values);
        try {
          if (Object.keys(state.values).length === 0) localStorage.removeItem(STORAGE_KEY);
          else localStorage.setItem(STORAGE_KEY, JSON.stringify(state.values));
        } catch (_) {}
        queueSocialSync();
      }

      function sanitizeName(value) {
        return String(value || "").replace(/\s+/g, " ").trim().slice(0, 28);
      }

      function loadProfileName() {

      function saveProfileName(name) {

      }


      let supabaseClient = null;
      let socialUser = null;
      let socialSyncTimer = null;
      let onlineProfilePromise = null;

      function supabaseConfigured() {
        return /^https:\/\/.+\.supabase\.co$/i.test(SUPABASE_URL) &&
               SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_") &&
               !SUPABASE_URL.includes("DEIN-PROJEKT") &&
               !SUPABASE_PUBLISHABLE_KEY.includes("DEIN_KEY");
      }

      function getSupabase() {
        if (!supabaseConfigured()) return null;
        if (!supabaseClient) {
          supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
              auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
              }
            }
          );
        }
        return supabaseClient;
      }

      function randomFriendCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const values = new Uint32Array(6);
        crypto.getRandomValues(values);
        return Array.from(values, value => chars[value % chars.length]).join("");
      }

      async function ensureSocialAuth() {
        const sb = getSupabase();
        if (!sb) return null;
        if (socialUser) return socialUser;

        const { data: sessionData } = await sb.auth.getSession();
        if (sessionData?.session?.user) {
          socialUser = sessionData.session.user;
          return socialUser;
        }

        const { data, error } = await sb.auth.signInAnonymously();
        if (error) throw error;
        socialUser = data.user;
        return socialUser;
      }

      async function ensureOnlineProfile() {
        // Es darf immer nur ein Profil-Sync gleichzeitig laufen.
        if (onlineProfilePromise) return onlineProfilePromise;

        onlineProfilePromise = (async () => {
          const sb = getSupabase();
          const user = await ensureSocialAuth();
          if (!sb || !user || !state.name) return null;

          // Vorhandenes Profil laden, damit der bestehende Freundescode
          // auf keinen Fall unnötig geändert wird.
          const { data: existing, error: readError } = await sb
            .from("profiles")
            .select("id,friend_code,display_name,avatar_data")
            .eq("id", user.id)
            .maybeSingle();

          if (readError) throw readError;

          let friendCode = existing?.friend_code || null;

          // Nur für einen wirklich neuen User einen Code erzeugen.
          if (!friendCode) {
            for (let attempt = 0; attempt < 8; attempt += 1) {
              const candidate = randomFriendCode();

              const { data: codeOwner, error: codeError } = await sb
                .from("profiles")
                .select("id")
                .eq("friend_code", candidate)
                .maybeSingle();

              if (codeError) throw codeError;

              if (!codeOwner) {
                friendCode = candidate;
                break;
              }
            }

            if (!friendCode) {
              throw new Error("Kein eindeutiger Freundescode konnte erzeugt werden.");
            }
          }

          // WICHTIG:
          // Nicht mehr INSERT, sondern UPSERT über die Auth-User-ID.
          // Existiert dieselbe ID bereits, wird das Profil aktualisiert.
          // Dadurch kann profiles_pkey nicht mehr durch einen zweiten Sync
          // derselben User-ID ausgelöst werden.
          const { data: profile, error: profileError } = await sb
            .from("profiles")
            .upsert({
              id: user.id,
              friend_code: friendCode,
              display_name: state.name,
              avatar_data: state.profileImage || null,
              updated_at: new Date().toISOString()
            }, { onConflict: "id" })
            .select("id,friend_code,display_name,avatar_data")
            .single();

          if (profileError) throw profileError;

          // Trainingswerte ebenfalls per User-ID spiegeln.
          const { error: statsError } = await sb
            .from("stats")
            .upsert({
              user_id: user.id,
              values_json: state.values,
              updated_at: new Date().toISOString()
            }, { onConflict: "user_id" });

          if (statsError) throw statsError;

          return profile;
        })();

        try {
          return await onlineProfilePromise;
        } finally {
          onlineProfilePromise = null;
        }
      }

      function queueSocialSync() {
        if (!supabaseConfigured() || !state?.name) return;
        clearTimeout(socialSyncTimer);
        socialSyncTimer = setTimeout(() => {
          ensureOnlineProfile().catch(error => console.error("Supabase Sync:", error));
        }, 450);
      }

      function friendAvatarMarkup(profile, big = false) {
        const cls = big ? "friend-profile-avatar-big" : "friend-avatar";
        if (profile?.avatar_data) {
          return `<span class="${cls}"><img src="${profile.avatar_data}" alt=""></span>`;
        }
        return `<span class="${cls}">${escapeHtml(profileInitials(profile?.display_name || "CL"))}</span>`;
      }

      function getRemoteOverallRank(values) {
        const entered = ALL_EXERCISES.filter(exercise => Number(values?.[exercise.id] || 0) > 0);
        if (!entered.length) return { ...UNRANKED };

        const score = entered.reduce((sum, exercise) => {
          const value = Number(values[exercise.id] || 0);
          return sum + Math.max(0, getRankInfo(value, exercise.t, true).idx);
        }, 0) / entered.length;

        const idx = Math.min(RANKS.length - 1, Math.floor(score));
        return { idx, ...RANKS[idx], isUnranked: false };
      }

      function getRemoteCategoryRank(values, categoryKey) {
        const exercises = DATA[categoryKey].exercises;
        const entered = exercises.filter(exercise => Number(values?.[exercise.id] || 0) > 0);
        if (!entered.length) return "Offen";

        const score = entered.reduce((sum, exercise) => {
          const value = Number(values[exercise.id] || 0);
          return sum + Math.max(0, getRankInfo(value, exercise.t, true).idx);
        }, 0) / entered.length;

        return RANKS[Math.min(RANKS.length - 1, Math.floor(score))].name;
      }

      async function loadFriendsData() {
        const sb = getSupabase();
        const user = await ensureSocialAuth();

        const { data: requests, error: reqError } = await sb
          .from("friendships")
          .select(`
            id,
            requester,
            addressee,
            status,
            requester_profile:profiles!friendships_requester_fkey(
              id, friend_code, display_name, avatar_data
            )
          `)
          .eq("addressee", user.id)
          .eq("status", "pending")
          .order("created_at", { ascending: false });

        if (reqError) throw reqError;

        const { data: friendshipRows, error: friendsError } = await sb
          .from("friendships")
          .select(`
            id,
            requester,
            addressee,
            status,
            requester_profile:profiles!friendships_requester_fkey(
              id, friend_code, display_name, avatar_data
            ),
            addressee_profile:profiles!friendships_addressee_fkey(
              id, friend_code, display_name, avatar_data
            )
          `)
          .eq("status", "accepted")
          .or(`requester.eq.${user.id},addressee.eq.${user.id}`)
          .order("created_at", { ascending: false });

        if (friendsError) throw friendsError;

        const friends = (friendshipRows || []).map(row => ({
          friendshipId: row.id,
          profile: row.requester === user.id ? row.addressee_profile : row.requester_profile
        })).filter(item => item.profile);

        return { requests: requests || [], friends };
      }

      async function sendFriendRequestByCode() {
        const input = document.getElementById("friend-code-input");
        const code = String(input?.value || "").trim().toUpperCase();
        if (code.length !== 6) {
          showToast("Bitte einen 6-stelligen Freundescode eingeben.");
          return;
        }

        const sb = getSupabase();
        const user = await ensureSocialAuth();

        const { data: target, error: targetError } = await sb
          .from("profiles")
          .select("id,friend_code,display_name,avatar_data")
          .eq("friend_code", code)
          .maybeSingle();

        if (targetError) throw targetError;
        if (!target) {
          showToast("Freundescode nicht gefunden.");
          return;
        }
        if (target.id === user.id) {
          showToast("Das ist dein eigener Freundescode.");
          return;
        }

        const { data: existing, error: existingError } = await sb
          .from("friendships")
          .select("id,status,requester,addressee")
          .or(`and(requester.eq.${user.id},addressee.eq.${target.id}),and(requester.eq.${target.id},addressee.eq.${user.id})`);

        if (existingError) throw existingError;

        if (existing?.some(row => row.status === "accepted")) {
          showToast(`${target.display_name} ist bereits dein Freund.`);
          return;
        }

        if (existing?.some(row => row.status === "pending")) {
          showToast("Zwischen euch gibt es bereits eine offene Anfrage.");
          return;
        }

        const { error } = await sb
          .from("friendships")
          .insert({
            requester: user.id,
            addressee: target.id,
            status: "pending"
          });

        if (error) throw error;
        if (input) input.value = "";
        showToast(`Anfrage an ${target.display_name} gesendet.`);
        await renderFriendsSection();
      }

      function profileInitials(name) {
        const parts = sanitizeName(name).split(" ").filter(Boolean);
        if (!parts.length) return "CL";
        return (parts.length === 1 ? parts[0].slice(0,2) : parts[0][0] + parts[parts.length-1][0]).toUpperCase();
      }

      function firstName(name) {
        return sanitizeName(name).split(" ")[0] || "Athlet";
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function hasStoredValue(exerciseId) {
        return Object.prototype.hasOwnProperty.call(state.values, exerciseId);
      }

      function getRankInfo(value, thresholds, hasValue = true) {
        const safeValue = Math.max(0, Math.round(Number(value) || 0));

        if (!hasValue) {
          return {
            ...UNRANKED,
            upper: thresholds[0] ?? null,
            next: RANKS[0] ?? null
          };
        }

        if (safeValue === 0) {
          return {
            idx: 0,
            ...RANKS[0],
            progress: 0,
            lower: 0,
            upper: thresholds[0] ?? null,
            next: RANKS[1] ?? null,
            isUnranked: false
          };
        }

        let idx = 0;
        for (let i = 0; i < thresholds.length; i += 1) {
          if (safeValue >= thresholds[i]) idx = i + 1;
        }

        const lower = idx === 0 ? 0 : thresholds[idx - 1];
        const upper = idx < thresholds.length ? thresholds[idx] : null;
        const progress = upper === null
          ? 100
          : clamp(((safeValue - lower) / Math.max(1, upper - lower)) * 100, 0, 100);

        return {
          idx,
          ...RANKS[idx],
          progress,
          lower,
          upper,
          next: idx < RANKS.length - 1 ? RANKS[idx + 1] : null,
          isUnranked: false
        };
      }

      function getOverallRank() {
        const entered = ALL_EXERCISES.filter(exercise => hasStoredValue(exercise.id));
        if (entered.length === 0) return { ...UNRANKED };

        // Overall Strength bewertet nur tatsächlich erfasste Leistungen.
        // Die Profil-Vollständigkeit wird separat angezeigt.
        const score = entered.reduce((sum, exercise) => {
          const info = getRankInfo(Number(state.values[exercise.id] || 0), exercise.t, hasStoredValue(exercise.id));
          return sum + Math.max(0, info.idx);
        }, 0) / entered.length;

        const idx = Math.min(RANKS.length - 1, Math.floor(score));
        const progress = idx === RANKS.length - 1 ? 100 : (score - idx) * 100;
        return {
          idx,
          ...RANKS[idx],
          progress,
          next: idx < RANKS.length - 1 ? RANKS[idx + 1] : null,
          isUnranked: false
        };
      }

      function getCategoryRank(categoryKey) {
        const exercises = ALL_EXERCISES.filter(exercise => exercise.category === categoryKey);
        const entered = exercises.filter(exercise => hasStoredValue(exercise.id));
        if (!entered.length) return { ...UNRANKED, completion: 0, entered: 0, total: exercises.length, score: 0 };
        const score = entered.reduce((sum, exercise) => sum + Math.max(0, getRankInfo(Number(state.values[exercise.id]), exercise.t).idx), 0) / entered.length;
        const idx = Math.min(RANKS.length - 1, Math.floor(score));
        return { idx, ...RANKS[idx], progress: idx === RANKS.length - 1 ? 100 : (score - idx) * 100, completion: Math.round(entered.length / exercises.length * 100), entered: entered.length, total: exercises.length, score };
      }


      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_) { return {}; }
      }

      function saveHistory() {
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history || {})); } catch (_) {}
      }

      function recordHistory(exercise, value, oldValue) {
        if (!exercise || value <= 0 || value === oldValue) return;
        const list = Array.isArray(state.history[exercise.id]) ? state.history[exercise.id] : [];
        if (!list.length || list[list.length - 1].value !== value) {
          list.push({ value, at: Date.now() });
          state.history[exercise.id] = list.slice(-12);
          saveHistory();
        }
      }

      function commitPendingHistory() {
        const exercise = ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
        if (!exercise) return;

        const finalValue = Math.max(0, Math.round(Number(state.historyPendingValue) || 0));
        const entryValue = Math.max(0, Math.round(Number(state.historyEntryValue) || 0));

        if (finalValue > 0 && finalValue !== entryValue) {
          recordHistory(exercise, finalValue, entryValue);
        }

        state.historyEntryValue = null;
        state.historyPendingValue = null;
      }

      function getClosestRankUps(limit = 3) {
        return ALL_EXERCISES.map(exercise => {
          const value = Number(state.values[exercise.id] || 0);
          const info = getRankInfo(value, exercise.t, hasStoredValue(exercise.id));

          if (!info.next || info.upper === null) return null;

          const missing = Math.max(0, info.upper - value);

          return {
            exercise,
            info,
            value,
            missing
          };
        })
        .filter(Boolean)
        .sort((a, b) => {
          // Wirklich nur der absolute fehlende Wert zählt:
          // 1 Wdh./Sek. vor 2, 2 vor 3 usw.
          if (a.missing !== b.missing) return a.missing - b.missing;

          // Bei Gleichstand kommt die bereits weiter fortgeschrittene Übung zuerst.
          if (a.info.idx !== b.info.idx) return b.info.idx - a.info.idx;

          // Danach stabil nach aktuellem Wert sortieren.
          return b.value - a.value;
        })
        .slice(0, limit);
      }

      async function createStrengthCardBlob() {
        const svg = strengthCardSvg();
        const encoded = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("SVG konnte nicht geladen werden."));
          img.src = encoded;
        });

        const canvas = document.createElement("canvas");
        canvas.width = 1140;
        canvas.height = 1140;

        const ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("Canvas wird nicht unterstützt.");

        ctx.drawImage(image, 0, 0, 1140, 1140);

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(result => {
            if (result) resolve(result);
            else reject(new Error("PNG konnte nicht erzeugt werden."));
          }, "image/png");
        });

        return blob;
      }


      function getBalanceData() {
        const categories = CATEGORY_KEYS.map(key => ({ key, info: getCategoryRank(key) }));
        const rated = categories.filter(item => !item.info.isUnranked);

        if (rated.length < 2) {
          return { score: 0, categories, ready: false };
        }

        const scores = rated.map(item => item.info.score);
        const highest = Math.max(...scores);
        const lowest = Math.min(...scores);

        // 100 % bedeutet: alle bewerteten Bereiche liegen exakt gleichauf.
        // Pro Level Abstand zwischen stärkstem und schwächstem Bereich gehen
        // rund 8,33 Prozentpunkte verloren (12 Level Spannweite).
        const score = Math.round(clamp(100 - ((highest - lowest) / 12) * 100, 0, 100));
        return { score, categories, ready: true };
      }
