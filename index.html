      let supabaseClient = null;
      let socialUser = null;
      let legacyAnonymousUser = null;
      let socialProfile = null;
      let socialProfilePromise = null;
      let socialSyncTimer = null;
      let socialSyncPromise = Promise.resolve();
      let friendsRefreshPromise = null;
      let friendsChannel = null;
      let friendsFallbackTimer = null;
      let authSubscription = null;
      let suppressNextSignedOutReset = false;

      function supabaseConfigured() {
        return /^https:\/\/.+\.supabase\.co$/i.test(SUPABASE_URL) &&
               SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_") &&
               !SUPABASE_URL.includes("DEIN-PROJEKT") &&
               !SUPABASE_PUBLISHABLE_KEY.includes("DEIN_KEY");
      }

      function getSupabase() {
        if (!supabaseConfigured() || !window.supabase) return null;
        if (!supabaseClient) {
          supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
              auth: {
                // Ausschließlich die Supabase-Session wird lokal gehalten. Namen,
                // Bilder, Werte und Verlauf liegen nicht im Browser-Speicher.
                storage: getAuthStorage(),
                storageKey: SUPABASE_AUTH_STORAGE_KEY,
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
              }
            }
          );
        }
        return supabaseClient;
      }

      function isVerifiedEmailUser(user) {
        return Boolean(
          user?.id &&
          user?.email &&
          (user.email_confirmed_at || user.confirmed_at) &&
          user.is_anonymous !== true
        );
      }

      function hasVerifiedAccount() {
        return isVerifiedEmailUser(socialUser);
      }

      async function ensureSocialAuth() {
        if (hasVerifiedAccount()) return socialUser;
        const sb = getSupabase();
        if (!sb) throw new Error("SUPABASE_NOT_CONFIGURED");
        const { data, error } = await sb.auth.getUser();
        if (error) throw error;
        if (!isVerifiedEmailUser(data?.user)) throw new Error("EMAIL_ACCOUNT_REQUIRED");
        socialUser = data.user;
        legacyAnonymousUser = null;
        return socialUser;
      }

      function normalizeAccountSnapshot(data) {
        const value = data && typeof data === "object" ? data : {};
        return {
          profile: value.profile && typeof value.profile === "object" ? value.profile : null,
          values: sanitizeValues(value.values),
          history: sanitizeHistory(value.history),
          email: String(value.email || socialUser?.email || "")
        };
      }

      async function fetchAccountSnapshot() {
        const sb = getSupabase();
        await ensureSocialAuth();
        const { data, error } = await sb.rpc("get_clastanic_account_snapshot");
        if (error) throw error;
        return normalizeAccountSnapshot(data);
      }

      function applyAccountSnapshot(snapshot, guestState = null) {
        const normalized = normalizeAccountSnapshot(snapshot);
        const profile = normalized.profile;

        state.name = sanitizeName(profile?.display_name || guestState?.name || "");
        state.profileImage = profile?.avatar_data || guestState?.profileImage || "";
        state.values = guestState
          ? mergeValues(normalized.values, guestState.values)
          : sanitizeValues(normalized.values);
        state.history = guestState
          ? mergeHistory(normalized.history, guestState.history)
          : sanitizeHistory(normalized.history);
        socialProfile = profile;
        state.syncState = "synced";
        state.lastSyncedAt = Date.now();
      }

      async function loadLegacyAnonymousSnapshot(user) {
        const sb = getSupabase();
        if (!sb || !user?.id) return;
        const [profileResult, statsResult] = await Promise.all([
          sb.from("profiles")
            .select("id, friend_code, display_name, avatar_data")
            .eq("id", user.id)
            .maybeSingle(),
          sb.from("stats")
            .select("values_json, history_json")
            .eq("user_id", user.id)
            .maybeSingle()
        ]);

        if (profileResult.error) throw profileResult.error;
        if (statsResult.error) throw statsResult.error;

        socialProfile = profileResult.data || null;
        state.name = sanitizeName(profileResult.data?.display_name || "");
        state.profileImage = profileResult.data?.avatar_data || "";
        state.values = sanitizeValues(statsResult.data?.values_json);
        state.history = sanitizeHistory(statsResult.data?.history_json);
        state.syncState = "guest";
      }

      async function syncAccountState() {
        if (!hasVerifiedAccount() || !state.name) return null;
        const sb = getSupabase();
        const snapshot = captureCurrentState();
        state.syncState = "syncing";
        refreshAccountSurface();

        const { data, error } = await sb.rpc("save_clastanic_account_state", {
          p_display_name: snapshot.name,
          p_avatar_data: snapshot.profileImage || null,
          p_values: snapshot.values,
          p_history: snapshot.history
        });

        if (error) {
          state.syncState = "error";
          refreshAccountSurface();
          throw error;
        }

        const normalized = normalizeAccountSnapshot(data);
        socialProfile = normalized.profile || socialProfile;
        state.syncState = "synced";
        state.lastSyncedAt = Date.now();
        refreshAccountSurface();
        return normalized;
      }

      function runAccountSync() {
        socialSyncPromise = socialSyncPromise
          .catch(() => null)
          .then(() => syncAccountState());
        return socialSyncPromise;
      }

      function queueAccountSync(delay = 550) {
        if (!hasVerifiedAccount() || !state.name) return;
        state.syncState = "pending";
        refreshAccountSurface();
        clearTimeout(socialSyncTimer);
        socialSyncTimer = window.setTimeout(() => {
          runAccountSync().catch(error => console.error("Supabase Account Sync:", error));
        }, delay);
      }

      async function flushAccountSync() {
        if (!hasVerifiedAccount() || !state.name) return null;
        clearTimeout(socialSyncTimer);
        return runAccountSync();
      }

      async function ensureOnlineProfile(force = false) {
        if (socialProfile && !force) return socialProfile;
        if (socialProfilePromise) return socialProfilePromise;

        socialProfilePromise = (async () => {
          const snapshot = await fetchAccountSnapshot();
          if (snapshot.profile && !force) {
            socialProfile = snapshot.profile;
            return socialProfile;
          }
          await runAccountSync();
          return socialProfile;
        })();

        try {
          return await socialProfilePromise;
        } finally {
          socialProfilePromise = null;
        }
      }

      async function syncOnlineStats() {
        return runAccountSync();
      }

      function queueSocialSync() {
        queueAccountSync();
      }

      function normalizeEmail(value) {
        return String(value || "").trim().toLowerCase().slice(0, 254);
      }

      async function requestEmailOtp(email) {
        const sb = getSupabase();
        if (!sb) throw new Error("SUPABASE_NOT_CONFIGURED");
        const cleanEmail = normalizeEmail(email);
        if (!/^\S+@\S+\.\S+$/.test(cleanEmail)) throw new Error("INVALID_EMAIL");

        if (legacyAnonymousUser?.is_anonymous === true) {
          // Bestehende anonyme Testkonten behalten dadurch ihre User-ID,
          // ihren Freundescode und ihre Freundschaften.
          const { error } = await sb.auth.updateUser({ email: cleanEmail });
          if (error) throw error;
          state.otpFlow = "upgrade";
        } else {
          const { error } = await sb.auth.signInWithOtp({
            email: cleanEmail,
            options: {
              shouldCreateUser: true,
              data: { display_name: sanitizeName(state.name) }
            }
          });
          if (error) throw error;
          state.otpFlow = "signin";
        }

        state.otpEmail = cleanEmail;
        state.otpSent = true;
      }

      async function confirmEmailOtp(token) {
        const sb = getSupabase();
        if (!sb) throw new Error("SUPABASE_NOT_CONFIGURED");
        const cleanToken = String(token || "").replace(/\D/g, "").slice(0, 10);
        if (cleanToken.length < 6) throw new Error("INVALID_OTP");

        const guestState = captureCurrentState();
        const type = state.otpFlow === "upgrade" ? "email_change" : "email";
        const { data, error } = await sb.auth.verifyOtp({
          email: state.otpEmail,
          token: cleanToken,
          type
        });
        if (error) throw error;

        const verifiedUser = data?.user || data?.session?.user;
        if (!isVerifiedEmailUser(verifiedUser)) {
          const userResult = await sb.auth.getUser();
          if (userResult.error) throw userResult.error;
          if (!isVerifiedEmailUser(userResult.data?.user)) throw new Error("EMAIL_VERIFICATION_REQUIRED");
          socialUser = userResult.data.user;
        } else {
          socialUser = verifiedUser;
        }

        legacyAnonymousUser = null;
        const snapshot = await fetchAccountSnapshot();
        applyAccountSnapshot(snapshot, guestState);
        await runAccountSync();
        state.otpSent = false;
        state.otpEmail = "";
        state.otpFlow = "signin";
        return socialUser;
      }

      function stopFriendsRealtime() {
        clearInterval(friendsFallbackTimer);
        friendsFallbackTimer = null;
        if (friendsChannel && supabaseClient) {
          supabaseClient.removeChannel(friendsChannel).catch(() => null);
        }
        friendsChannel = null;
      }

      function resetInMemoryState({ keepProfile = false } = {}) {
        state.values = {};
        state.history = {};
        state.activeExerciseId = null;
        state.activeCategory = CATEGORY_KEYS[0];
        state.historyEntryValue = null;
        state.historyPendingValue = null;
        state.momentBaselineValue = 0;
        state.momentBaselineHasValue = false;
        state.pendingRankUp = null;
        clearTimeout(state.stepMomentTimer);
        clearTimeout(socialSyncTimer);

        if (!keepProfile) {
          state.name = "";
          state.profileImage = "";
          socialProfile = null;
        }
      }

      async function useExistingAccountInsteadOfLegacyAnonymous() {
        if (!legacyAnonymousUser || state.accountBusy) return;
        const sb = getSupabase();
        if (!sb) throw new Error("SUPABASE_NOT_CONFIGURED");
        const guestState = captureCurrentState();

        state.accountBusy = true;
        refreshAccountSurface();
        try {
          // Nur die lokale anonyme Sitzung lösen. Werte/Verlauf bleiben im RAM
          // und werden nach dem Login in den bestehenden Account gemerged.
          suppressNextSignedOutReset = true;
          const { error } = await sb.auth.signOut({ scope: "local" });
          if (error) throw error;
          window.setTimeout(() => { suppressNextSignedOutReset = false; }, 1500);

          socialUser = null;
          legacyAnonymousUser = null;
          socialProfile = null;
          state.otpSent = false;
          state.otpEmail = "";
          state.otpFlow = "signin";
          state.syncState = "guest";
          applyGuestState(guestState);
          showToast("Du kannst dich jetzt mit deiner bestehenden Account-E-Mail anmelden.");
        } catch (error) {
          suppressNextSignedOutReset = false;
          throw error;
        } finally {
          state.accountBusy = false;
          refreshAccountSurface();
        }
      }

      async function signOutAccount() {
        const sb = getSupabase();
        try { await flushAccountSync(); } catch (error) { console.error("Sync vor Abmeldung:", error); }
        stopFriendsRealtime();
        if (sb) {
          const { error } = await sb.auth.signOut({ scope: "local" });
          if (error) throw error;
        }
        socialUser = null;
        legacyAnonymousUser = null;
        socialProfile = null;
        state.syncState = "guest";
        state.otpSent = false;
        state.otpEmail = "";
        state.accountBusy = false;
        resetInMemoryState();
        renderWelcome();
      }

      function formatSyncTime(timestamp) {
        if (!timestamp) return "Noch nicht synchronisiert";
        try {
          return `Synchronisiert · ${new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" }).format(new Date(timestamp))}`;
        } catch (_) {
          return "Synchronisiert";
        }

      async function bootstrapApp() {
        // Alte Browserdaten werden genau einmal gelesen, danach endgültig entfernt.
        // Sie leben anschließend nur noch im RAM, bis der Nutzer seinen Account bestätigt.
        const legacyBrowserState = readLegacyBrowserState();
        clearLegacyAppStorage();

        const sb = getSupabase();
        if (!sb) {
          applyGuestState(legacyBrowserState);
          renderHome();
          return;
        }

        try {
          const { data: sessionData, error: sessionError } = await sb.auth.getSession();
          if (sessionError) throw sessionError;

          if (sessionData?.session) {
            const { data: userData, error: userError } = await sb.auth.getUser();
            if (userError) throw userError;
            const user = userData?.user;

            if (isVerifiedEmailUser(user)) {
              socialUser = user;
              const snapshot = await fetchAccountSnapshot();
              applyAccountSnapshot(snapshot, hasMeaningfulGuestState(legacyBrowserState) ? legacyBrowserState : null);
              if (hasMeaningfulGuestState(legacyBrowserState) && state.name) {
                await runAccountSync();
              }
            } else if (user?.is_anonymous === true) {
              legacyAnonymousUser = user;
              await loadLegacyAnonymousSnapshot(user);
              applyGuestState(legacyBrowserState);
            } else {
              applyGuestState(legacyBrowserState);
            }
          } else {
            applyGuestState(legacyBrowserState);
          }
        } catch (error) {
          console.error("Account-Start:", error);
          try { await sb.auth.signOut({ scope: "local" }); } catch (_) {}
          socialUser = null;
          legacyAnonymousUser = null;
          socialProfile = null;
          resetInMemoryState();
          applyGuestState(legacyBrowserState);
        }

        renderHome();

        const authChange = sb.auth.onAuthStateChange((event, session) => {
          if (event !== "SIGNED_OUT") return;
          if (suppressNextSignedOutReset) {
            suppressNextSignedOutReset = false;
            return;
          }
          window.setTimeout(() => {
            socialUser = null;
            legacyAnonymousUser = null;
            socialProfile = null;
            state.syncState = "guest";
            stopFriendsRealtime();
            resetInMemoryState();
            renderWelcome();
          }, 0);
        });
        authSubscription = authChange?.data?.subscription || null;
      }

      function getRemoteOverallRank(values) {
        const entered = ALL_EXERCISES.filter(exercise => Number(values?.[exercise.id] || 0) > 0);
        if (!entered.length) return { ...UNRANKED };

        const score = entered.reduce((sum, exercise) => {
          const value = Number(values[exercise.id] || 0);
          return sum + Math.max(0, getRankInfo(value, exercise.t, true).idx);
        }, 0) / entered.length;

        const idx = Math.min(RANKS.length - 1, Math.floor(score));
        return { idx, ...RANKS[idx], isUnranked: false };
      }

      function getRemoteCategoryRank(values, categoryKey) {
        const exercises = DATA[categoryKey].exercises;
        const entered = exercises.filter(exercise => Number(values?.[exercise.id] || 0) > 0);
        if (!entered.length) return "Offen";

        const score = entered.reduce((sum, exercise) => {
          const value = Number(values[exercise.id] || 0);
          return sum + Math.max(0, getRankInfo(value, exercise.t, true).idx);
        }, 0) / entered.length;

        return RANKS[Math.min(RANKS.length - 1, Math.floor(score))].name;
      }

      async function refreshFriendsDashboard(showLoading = false) {
        if (friendsRefreshPromise) return friendsRefreshPromise;

        friendsRefreshPromise = (async () => {
          const host = document.getElementById("friends-host");
          if (!host) return;

          if (!supabaseConfigured()) {
            throw new Error("Supabase ist noch nicht vollständig konfiguriert.");
          }

          if (showLoading) {
            host.innerHTML = `<section class="friends-card"><div class="friends-message">Freundesprofil wird geladen …</div></section>`;
          }

          const profile = socialProfile || await ensureOnlineProfile();
          const sb = getSupabase();
          const { data, error } = await sb.rpc("get_clastanic_friend_dashboard");
          if (error) throw error;

          renderFriendsMarkup(profile, normalizeDashboard(data));
        })();

        try {
          return await friendsRefreshPromise;
        } finally {
          friendsRefreshPromise = null;
        }
      }

      async function subscribeFriendsRealtime() {
        if (friendsChannel) return;

        const sb = getSupabase();
        const user = await ensureSocialAuth();
        if (!sb || !user) return;

        friendsChannel = sb
          .channel(`calisthenx-friendships-${user.id}`)
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "friendships" },
            () => {
              if (document.getElementById("friends-host")) {
                refreshFriendsDashboard(false).catch(error => console.error("Realtime Friends:", error));
              }
            }
          )
          .subscribe(status => {
            if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
              console.warn("Friends Realtime:", status);
            }
          });
      }

      function profileInitials(name) {
        const parts = sanitizeName(name).split(" ").filter(Boolean);
        if (!parts.length) return "CL";
        return (parts.length === 1 ? parts[0].slice(0,2) : parts[0][0] + parts[parts.length-1][0]).toUpperCase();
      }

      function firstName(name) {
        return sanitizeName(name).split(" ")[0] || "Athlet";
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function hasStoredValue(exerciseId) {
        return Object.prototype.hasOwnProperty.call(state.values, exerciseId);
      }

      function getRankInfo(value, thresholds, hasValue = true) {
        const safeValue = Math.max(0, Math.round(Number(value) || 0));

        if (!hasValue) {
          return {
            ...UNRANKED,
            upper: thresholds[0] ?? null,
            next: RANKS[0] ?? null
          };
        }

        if (safeValue === 0) {
          return {
            idx: 0,
            ...RANKS[0],
            progress: 0,
            lower: 0,
            upper: thresholds[0] ?? null,
            next: RANKS[1] ?? null,
            isUnranked: false
          };
        }

        let idx = 0;
        for (let i = 0; i < thresholds.length; i += 1) {
          if (safeValue >= thresholds[i]) idx = i + 1;
        }

        const lower = idx === 0 ? 0 : thresholds[idx - 1];
        const upper = idx < thresholds.length ? thresholds[idx] : null;
        const progress = upper === null
          ? 100
          : clamp(((safeValue - lower) / Math.max(1, upper - lower)) * 100, 0, 100);

        return {
          idx,
          ...RANKS[idx],
          progress,
          lower,
          upper,
          next: idx < RANKS.length - 1 ? RANKS[idx + 1] : null,
          isUnranked: false
        };
      }

      function getOverallRank() {
        const entered = ALL_EXERCISES.filter(exercise => hasStoredValue(exercise.id));
        if (entered.length === 0) return { ...UNRANKED };

        // Overall Strength bewertet nur tatsächlich erfasste Leistungen.
        // Die Profil-Vollständigkeit wird separat angezeigt.
        const score = entered.reduce((sum, exercise) => {
          const info = getRankInfo(Number(state.values[exercise.id] || 0), exercise.t, hasStoredValue(exercise.id));
          return sum + Math.max(0, info.idx);
        }, 0) / entered.length;

        const idx = Math.min(RANKS.length - 1, Math.floor(score));
        const progress = idx === RANKS.length - 1 ? 100 : (score - idx) * 100;
        return {
          idx,
          ...RANKS[idx],
          progress,
          next: idx < RANKS.length - 1 ? RANKS[idx + 1] : null,
          isUnranked: false
        };
      }

      function getCategoryRank(categoryKey) {
        const exercises = ALL_EXERCISES.filter(exercise => exercise.category === categoryKey);
        const entered = exercises.filter(exercise => hasStoredValue(exercise.id));
        if (!entered.length) return { ...UNRANKED, completion: 0, entered: 0, total: exercises.length, score: 0 };
        const score = entered.reduce((sum, exercise) => sum + Math.max(0, getRankInfo(Number(state.values[exercise.id]), exercise.t).idx), 0) / entered.length;
        const idx = Math.min(RANKS.length - 1, Math.floor(score));
        return { idx, ...RANKS[idx], progress: idx === RANKS.length - 1 ? 100 : (score - idx) * 100, completion: Math.round(entered.length / exercises.length * 100), entered: entered.length, total: exercises.length, score };
      }


      function countEnteredExercises() {
        return ALL_EXERCISES.filter(exercise => hasStoredValue(exercise.id) && Number(state.values[exercise.id] || 0) > 0).length;
      }





      function getExerciseValue(id) {
        return Math.max(0, Math.round(Number(state.values[id] || 0)));
      }



















      let sparklineUid = 0;

      function historyForExercise(exercise, includeCurrent = true) {
        const list = Array.isArray(state.history?.[exercise.id])
          ? state.history[exercise.id].map(entry => ({ value: Math.max(0, Number(entry.value) || 0), at: Number(entry.at) || Date.now() }))
          : [];
        list.sort((a,b) => a.at - b.at);
        if (includeCurrent) {
          const current = getExerciseValue(exercise.id);
          if (current > 0 && (!list.length || list[list.length - 1].value !== current)) {
            list.push({ value: current, at: Date.now(), temporary: true });
          }
        }
        return list.slice(-12);
      }

      function getPRMoments() {
        const moments = [];
        ALL_EXERCISES.forEach(exercise => {
          let record = 0;
          historyForExercise(exercise, false).forEach(entry => {
            if (entry.value > record) {
              moments.push({ exercise, value: entry.value, previous: record, delta: entry.value - record, at: entry.at });
              record = entry.value;
            }
          });
        });
        return moments.sort((a,b) => b.at - a.at);
      }




      function getKnownPersonalBest(exercise) {
        const historyMax = historyForExercise(exercise, false).reduce((max, entry) => Math.max(max, entry.value), 0);
        return Math.max(historyMax, getExerciseValue(exercise.id));
      }

      function getPRStats() {
        const moments = getPRMoments();
        const latest = moments[0] || null;
        const biggest = moments.slice().sort((a,b) => {
          const ap = a.previous > 0 ? a.delta / a.previous : a.delta;
          const bp = b.previous > 0 ? b.delta / b.previous : b.delta;
          return bp - ap;
        })[0] || null;
        return { moments, latest, biggest, activeRecords: countEnteredExercises() };
      }

      function formatShortDate(timestamp) {
        try { return new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "short" }).format(new Date(timestamp)); }
        catch (_) { return new Date(timestamp).toLocaleDateString("de-DE"); }
      }

      function historySparkline(entries, accent = "#7257f7", compact = false, showPointLabels = false) {
        const values = entries.map(entry => Math.max(0, Number(entry.value) || 0));
        if (!values.length) return "";

        const width = compact ? 310 : (showPointLabels ? 520 : 420);
        const height = compact ? 78 : (showPointLabels ? 142 : 105);
        const padX = showPointLabels ? 24 : 10;
        const padTop = showPointLabels ? 28 : 10;
        const padBottom = showPointLabels ? 28 : 10;

        const min = Math.min(...values);
        const max = Math.max(...values);
        const span = Math.max(1, max - min);

        const x = index => values.length === 1
          ? width / 2
          : padX + (index / (values.length - 1)) * (width - padX * 2);

        const y = value => {
          const usableHeight = height - padTop - padBottom;
          return padTop + (1 - ((value - min) / span)) * usableHeight;
        };

        const points = values.map((value,index) => `${x(index).toFixed(1)},${y(value).toFixed(1)}`).join(" ");
        const areaBottom = height - padBottom;
        const area = `${padX},${areaBottom} ${points} ${width-padX},${areaBottom}`;
        const uid = `spark-${++sparklineUid}`;
        const gridTop = padTop + (height - padTop - padBottom) * .33;
        const gridBottom = padTop + (height - padTop - padBottom) * .66;

        const pointMarkup = entries.map((entry,index) => {
          const value = values[index];
          const px = x(index).toFixed(1);
          const py = y(value).toFixed(1);
          const anchor = index === 0 ? "start" : (index === entries.length - 1 ? "end" : "middle");
          const date = entry.temporary ? "Aktuell" : formatShortDate(entry.at);
          const prHalo = entry.isPR
            ? `<circle class="pr-halo" cx="${px}" cy="${py}" r="8" stroke="${accent}"/>`
            : "";
          const labels = showPointLabels
            ? `<text class="point-value" x="${px}" y="${Math.max(12,Number(py)-11)}" text-anchor="${anchor}">${Math.round(value)}</text>
               <text class="point-date" x="${px}" y="${height-7}" text-anchor="${anchor}">${escapeHtml(date)}</text>`
            : "";
          return `${prHalo}<circle class="dot" cx="${px}" cy="${py}" r="${index===values.length-1?4.8:3.3}" fill="${accent}"/>${labels}`;
        }).join("");

        return `<svg class="history-sparkline${showPointLabels ? " labeled" : ""}" viewBox="0 0 ${width} ${height}" aria-hidden="true">
          <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${accent}" stop-opacity=".8"/><stop offset="1" stop-color="${accent}" stop-opacity="0"/></linearGradient></defs>
          <path class="grid-line" d="M${padX} ${gridTop.toFixed(1)}H${width-padX}M${padX} ${gridBottom.toFixed(1)}H${width-padX}"/>
          <polygon class="area" points="${area}" fill="url(#${uid})"/>
          <polyline class="line" points="${points}" stroke="${accent}"/>
          ${pointMarkup}
        </svg>`;
      }

      function markHistoryPRs(entries) {
        let record = 0;
        return entries.map(entry => {
          const isPR = entry.value > record;
          if (isPR) record = entry.value;
          return { ...entry, isPR };
        });
      }

      function renderPRHub() {
        const stats = getPRStats();

        const latestValue = latest ? Math.round(latest.value) : 0;
        const latestUnit = latest ? (latest.exercise.type === "time" ? "Sekunden" : "Wiederholungen") : "Noch kein PR";

        const previous = latest ? Math.max(0, Number(latest.previous) || 0) : 0;
        const improvementPercent = latest
          ? (previous > 0 ? Math.round((latest.delta / previous) * 100) : 100)

            ${latest ? `

      function recordHistory(exercise, value, oldValue) {
        if (!exercise || value <= 0 || value === oldValue) return false;
        const list = Array.isArray(state.history[exercise.id]) ? state.history[exercise.id] : [];
        if (!list.length || Number(list[list.length - 1].value) !== value) {
          list.push({ value, at: Date.now() });
          state.history[exercise.id] = list.slice(-12);
          saveHistory();
          return true;
        }
        return false;
      }

      function commitPendingHistory() {
        const exercise = ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
        if (!exercise) return;

        const finalValue = Math.max(0, Math.round(Number(state.historyPendingValue) || 0));
        const entryValue = Math.max(0, Math.round(Number(state.historyEntryValue) || 0));

        if (finalValue > 0 && finalValue !== entryValue) {
          recordHistory(exercise, finalValue, entryValue);
        }

        const historyHost = document.getElementById("exercise-history-host");
        if (historyHost) historyHost.innerHTML = renderHistory(exercise);

        state.historyEntryValue = null;
        state.historyPendingValue = null;
      }

      function getClosestRankUps(limit = 3) {
        return ALL_EXERCISES.map(exercise => {
          const value = Number(state.values[exercise.id] || 0);
          const info = getRankInfo(value, exercise.t, hasStoredValue(exercise.id));

          if (!info.next || info.upper === null) return null;

          const missing = Math.max(0, info.upper - value);

          return {
            exercise,
            info,
            value,
            missing
          };
        })
        .filter(Boolean)
        .sort((a, b) => {
          // Wirklich nur der absolute fehlende Wert zählt:
          // 1 Wdh./Sek. vor 2, 2 vor 3 usw.
          if (a.missing !== b.missing) return a.missing - b.missing;

          // Bei Gleichstand kommt die bereits weiter fortgeschrittene Übung zuerst.
          if (a.info.idx !== b.info.idx) return b.info.idx - a.info.idx;

          // Danach stabil nach aktuellem Wert sortieren.
          return b.value - a.value;
        })
        .slice(0, limit);
      }

      function renderClosestCard() {
        const items = getClosestRankUps(3);
        if (!items.length) return "";
        return `<section class="hub-card closest-card closest-card-clean closest-card-v2">

function getBalanceData() {
        const categories = CATEGORY_KEYS.map(key => ({ key, info: getCategoryRank(key) }));
        const rated = categories.filter(item => !item.info.isUnranked);

        if (rated.length < 2) {
          return { score: 0, categories, ready: false };
        }

        const scores = rated.map(item => item.info.score);
        const highest = Math.max(...scores);
        const lowest = Math.min(...scores);

        // 100 % bedeutet: alle bewerteten Bereiche liegen exakt gleichauf.
        // Pro Level Abstand zwischen stärkstem und schwächstem Bereich gehen
        // rund 8,33 Prozentpunkte verloren (12 Level Spannweite).
        const score = Math.round(clamp(100 - ((highest - lowest) / 12) * 100, 0, 100));
        return { score, categories, ready: true };
      }

      function getAthleteArchetype() {

      function getApexScore() {
        const maxSteps = ALL_EXERCISES.length * 12;
        const steps = ALL_EXERCISES.reduce((sum, exercise) => {
          const info = getRankInfo(Number(state.values[exercise.id] || 0), exercise.t, hasStoredValue(exercise.id));
          return sum + Math.max(0, info.idx);
        }, 0);
        const mastery = maxSteps ? (steps / maxSteps) * 100 : 0;
        const entered = countEnteredExercises();
        const completion = ALL_EXERCISES.length ? (entered / ALL_EXERCISES.length) * 100 : 0;
        const balanceData = getBalanceData();
        const balance = balanceData.ready ? balanceData.score : 0;
        const score = Math.round(clamp(mastery * 7.6 + balance * 1.4 + completion, 0, 1000));
        const tiers = [
          { min: 0, name: "Unscored" }, { min: 100, name: "Initiate" }, { min: 250, name: "Foundation" },
          { min: 400, name: "Control" }, { min: 550, name: "Power" }, { min: 700, name: "Athlete" },
          { min: 820, name: "Elite" }, { min: 930, name: "Master" }, { min: 1000, name: "Apex" }
        ];
        const tier = [...tiers].reverse().find(item => score >= item.min) || tiers[0];
        const next = tiers.find(item => item.min > score) || null;
        return {
          score, tier, next, steps, maxSteps,
          percent: Math.round(mastery), mastery: Math.round(mastery),
          completion: Math.round(completion), balance: Math.round(balance), entered
        };
      }

      function getNextGoal() {
        // Ziele laufen bewusst wie ein fester 23er-Kreis durch die App:
        // erst jede Übung auf Basis I, danach jede auf Basis II usw.
        // So wird keine einzelne Lieblingsübung mehrere Ränge vorausgezogen.
        for (let targetRank = 1; targetRank < RANKS.length; targetRank += 1) {
          const roundItems = ALL_EXERCISES.map((exercise, index) => {
            const value = Number(state.values[exercise.id] || 0);
            const info = getRankInfo(value, exercise.t, hasStoredValue(exercise.id));
            return { exercise, index, value, info };
          });

          const next = roundItems.find(item => item.info.idx < targetRank);
          if (!next) continue;

          const target = next.exercise.t[targetRank - 1];
          const lower = targetRank <= 1 ? 0 : next.exercise.t[targetRank - 2];
          const missing = Math.max(0, target - next.value);
          const ratio = clamp((next.value - lower) / Math.max(1, target - lower), 0, 1);
          const completedInRound = roundItems.filter(item => item.info.idx >= targetRank).length;

          return {
            ...next,
            targetRank,
            targetRankInfo: RANKS[targetRank],
            target,
            lower,
            missing,
            ratio,
            completedInRound,
            position: completedInRound + 1,
            total: ALL_EXERCISES.length
          };
        }

        return null;
      }

      function formatTime(seconds) {
        const safe = Math.max(0, Math.round(Number(seconds) || 0));
        if (safe < 60) return `${safe} Sek.`;
        const minutes = Math.floor(safe / 60);
        const rest = safe % 60;
        return `${minutes}:${String(rest).padStart(2, "0")} Min.`;
      }

      function formatValue(value, type) {
        const safe = Math.max(0, Math.round(Number(value) || 0));
        return type === "time" ? formatTime(safe) : `${safe} Wdh.`;
      }

      /* Dateinamen der 13 neuen PNG-Rangabzeichen.
         Alle Dateien liegen wie die Übungsbilder direkt neben dieser HTML-Datei. */
      const RANK_IMAGE_FILES = [
        "Start.png",
        "Basis1.png",
        "Basis2.png",
        "Kontrolle1.png",
        "Kontrolle2.png",
        "Kraft1.png",
        "Kraft2.png",
        "Athlet1.png",
        "Athlet2.png",
        "Elite1.png",
        "Elite2.png",
        "Meister.png",
        "Apex.png"
      ];

      function rankImageFile(rankInfo) {
        if (rankInfo?.isUnranked) return RANK_IMAGE_FILES[0];
        const safeIndex = clamp(Number(rankInfo?.idx) || 0, 0, RANK_IMAGE_FILES.length - 1);
        return RANK_IMAGE_FILES[safeIndex];
      }

      function rankBadge(rankInfo, size = 112, progressOverride = null) {
        const isUnranked = Boolean(rankInfo?.isUnranked);
        const safeIndex = isUnranked
          ? 0
          : clamp(Number(rankInfo?.idx) || 0, 0, RANK_IMAGE_FILES.length - 1);
        const fileName = rankImageFile(rankInfo);
        const rankName = isUnranked ? "Noch ohne Rang" : (rankInfo?.name || RANKS[safeIndex]?.name || "Rang");
        const progress = progressOverride === null
          ? Number(rankInfo?.progress || 0)
          : Number(progressOverride || 0);
        const safeProgress = Math.round(clamp(progress, 0, 100));
        const unrankedClass = isUnranked ? " is-unranked" : "";
        const accent = rankInfo?.accent || RANKS[safeIndex]?.accent || "#818991";
        const deep = rankInfo?.deep || RANKS[safeIndex]?.deep || "#1b2025";

        return `<img class="rank-badge${unrankedClass}"
          src="${escapeHtml(fileName)}"
          alt="${escapeHtml(`${rankName} Rangabzeichen`)}"
          width="${size}"
          height="${size}"
          decoding="async"
          draggable="false"
          data-rank-index="${safeIndex}"
          data-progress="${safeProgress}"
          style="--rank-accent:${escapeHtml(accent)};--rank-deep:${escapeHtml(deep)}"
          onerror="this.onerror=null;this.src='Start.png';this.classList.add('is-unranked')">`;
      }

      function renderExerciseCard(exercise, categoryKey) {
        const value = Number(state.values[exercise.id] || 0);
        const hasValue = hasStoredValue(exercise.id);
        const info = getRankInfo(value, exercise.t, hasValue);
        const visualAccent = getVisualAccent(info, categoryKey);
        const displayValue = hasValue ? formatValue(value, exercise.type) : "Noch offen";
        const rankName = hasValue ? info.name : "Nicht bewertet";

        return `
          <button class="exercise-card" type="button" onclick="caliApp.openExercise('${exercise.id}')"

            </span>
          </button>`;

      function exerciseMasteryData(exercise, value, info) {
        const hasValue = hasStoredValue(exercise.id);
        const mastery = !hasValue || info.isUnranked ? 0 : clamp(((info.idx + info.progress / 100) / 12) * 100, 0, 100);
        const score = Math.round(mastery * 10);
        const chapters = [
          { name: "Start", min: 0, max: 0, rank: 0 },
          { name: "Basis", min: 1, max: 2, rank: 2 },
          { name: "Kontrolle", min: 3, max: 4, rank: 4 },
          { name: "Kraft", min: 5, max: 6, rank: 6 },
          { name: "Athlet", min: 7, max: 8, rank: 8 },
          { name: "Elite", min: 9, max: 10, rank: 10 },
          { name: "Meister", min: 11, max: 11, rank: 11 },
          { name: "Apex", min: 12, max: 12, rank: 12 }
        ];
        const currentIdx = !hasValue || info.isUnranked ? -1 : info.idx;
        const stages = chapters.map(chapter => ({
          ...chapter,
          done: currentIdx > chapter.max,
          current: currentIdx >= chapter.min && currentIdx <= chapter.max,
          accent: RANKS[chapter.rank].accent
        }));
        const nextGate = !hasValue
          ? "Setze deinen ersten Bestwert und aktiviere das Mastery-System."
          : !info.next || info.upper === null
            ? "Apex vollständig gemeistert – es gibt keine höhere Schwelle."
            : `${formatValue(info.upper,exercise.type)} öffnen das Gate zu ${info.next.name}.`;
        return { mastery, score, stages, nextGate };

      function finalizePerformanceMoment(exercise = null) {
        const active = exercise || ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
        if (!active) return;

        clearTimeout(state.stepMomentTimer);

        const value = getExerciseValue(active.id);
        const baseline = Math.max(0, Number(state.momentBaselineValue) || 0);
        const baselineHadValue = Boolean(state.momentBaselineHasValue);
        const entryValue = Math.max(0, Number(state.historyEntryValue) || 0);

        // Den bisherigen echten PR VOR dem neuen Verlaufseintrag festhalten.
        // So löst ein erneuter Rangaufstieg unterhalb des alten PRs keinen
        // falschen "New Personal Record"-Moment aus.
        const historyBestBefore = historyForExercise(active, false)
          .reduce((max, entry) => Math.max(max, Math.max(0, Number(entry.value) || 0)), 0);
        const personalBestBefore = Math.max(historyBestBefore, entryValue);

        // Jeden bewusst abgeschlossenen Wert in den Verlauf übernehmen –
        // auch Rückschritte. So bleibt die Entwicklung vollständig sichtbar.
        if (value > 0 && value !== entryValue) {
          recordHistory(active, value, entryValue);
          state.historyEntryValue = value;
        }

        const oldInfo = getRankInfo(baseline, active.t, baselineHadValue || baseline > 0);
        const newInfo = getRankInfo(value, active.t, true);
        const moment = {
          from: baseline,
          to: value,
          delta: value - baseline,
          oldInfo,
          newInfo
        };

        // WICHTIG: Der Rang-Vergleich folgt immer dem zuletzt bestätigten Wert –
        // auch wenn dieser niedriger geworden ist. Dadurch kann derselbe Rang
        // beim späteren erneuten Überschreiten wieder gefeiert werden.
        state.momentBaselineValue = value;
        state.momentBaselineHasValue = true;

        if (value > baseline && newInfo.idx > oldInfo.idx) {
          showRankUpMoment(active, newInfo, value, moment);
        } else if (value > personalBestBefore) {
          showPersonalRecordMoment(active, moment);
        }

        if (hasVerifiedAccount()) {
          flushAccountSync().catch(error => console.error("Account final sync:", error));
        }
      }

      function schedulePerformanceMoment(exercise, delay = 620) {
        clearTimeout(state.stepMomentTimer);
        state.stepMomentTimer = window.setTimeout(() => finalizePerformanceMoment(exercise),delay);

        const target = exercise.type === "time" ? formatTime(info.upper) : `${info.upper} Wdh.`;
        if (missing === 0) return `${info.next.name} ist erreicht.`;
        return `${target} für ${info.next.name}.`;

      function renderThresholds(exercise, value, currentInfo) {
        return exercise.t.map((threshold, index) => {
          const rank = RANKS[index + 1];
          const reached = value >= threshold;
          const current = currentInfo.idx === index + 1;
          const label = exercise.type === "time" ? formatTime(threshold).replace(" Min.", "") : threshold;
          return `
            <div class="threshold ${reached ? "reached" : ""} ${current ? "current" : ""}"
                 style="--threshold-accent:${rank.accent}">
              <div class="threshold-rank">${escapeHtml(rank.name)}</div>
              <div class="threshold-value">${escapeHtml(label)}${exercise.type === "reps" ? "×" : ""}</div>
            </div>`;
        }).join("");

        state.stepMomentTimer = null;
        state.pendingRankUp = null;
        state.historyEntryValue = null;
        state.historyPendingValue = null;
        state.momentBaselineValue = 0;
        state.momentBaselineHasValue = false;

        delete state.values[exerciseId];
        delete state.history[exerciseId];

        // Erst lokal neu zeichnen. So ist der Reset sofort sichtbar.
        closeExerciseResetModal();
        renderDetail();

        // Danach genau diesen neuen Zustand speichern/synchronisieren.
        if (hasVerifiedAccount()) {
          state.syncState = "pending";
          try {
            await flushAccountSync();
            state.syncState = "synced";
            state.lastSyncedAt = Date.now();
          } catch (error) {
            console.error("Einzelreset Sync:", error);
            state.syncState = "error";
            showToast("Übung zurückgesetzt, Cloud-Sync ist fehlgeschlagen.");
            return;
          }
        }

        showToast(`${exercise.name} wurde zurückgesetzt.`);
      }

      async function performFullReset() {
        if (hasVerifiedAccount()) {
          const sb = getSupabase();
          state.accountBusy = true;
          try {
            const { error } = await sb.rpc("reset_clastanic_training_data");
            if (error) throw error;
            resetInMemoryState({ keepProfile: true });
            state.syncState = "synced";
            state.lastSyncedAt = Date.now();
            closeResetModal();
            closeRankModal();
            renderHome();
            showToast("Trainingsdaten im Account wurden gelöscht.");
          } catch (error) {
            console.error("Cloud-Reset:", error);
            showToast("Die Trainingsdaten konnten nicht gelöscht werden.");
          } finally {
            state.accountBusy = false;
          }
          return;
        }

        resetInMemoryState();
        closeResetModal();
        closeRankModal();
        renderWelcome();
      }

      window.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (document.getElementById("pr-modal")) closePersonalRecordModal();
          else if (document.getElementById("rankup-modal")) closeRankUpModal();
          else if (document.getElementById("name-edit-modal")) closeNameEditModal();
          else if (document.getElementById("exercise-reset-modal")) closeExerciseResetModal();
          else if (document.getElementById("reset-modal")) closeResetModal();
          else if (document.getElementById("rank-modal")) closeRankModal();
          else if (state.activeExerciseId) {
            commitPendingHistory();
            state.activeExerciseId = null;
            renderHome();
          }
        }
      });

      window.caliApp = {
        completeProfile(event) {
          event?.preventDefault();
          const input = document.getElementById("welcome-name");
          const name = saveProfileName(input?.value || "");
          if (!name) {
            input?.focus();
            input?.animate?.([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 220 });
            return;
          }
          renderHome();
        },


        async useExistingAccount() {
          try {
            await useExistingAccountInsteadOfLegacyAnonymous();
          } catch (error) {
            console.error("Anonyme Sitzung lösen:", error);
            showToast("Die anonyme Sitzung konnte nicht gelöst werden.");
          }
        },

        async sendAccountCode(event) {
          event?.preventDefault();
          if (state.accountBusy) return;
          const input = document.getElementById("account-email");
          const email = input?.value || "";
          state.accountBusy = true;
          refreshAccountSurface();
          try {
            await requestEmailOtp(email);
            refreshAccountSurface();
            requestAnimationFrame(() => document.getElementById("account-code")?.focus());
            showToast("Bestätigungscode wurde gesendet.");
          } catch (error) {
            console.error("OTP senden:", error);
            const message = String(error?.message || "");
            if (message.includes("INVALID_EMAIL")) showToast("Bitte eine gültige E-Mail-Adresse eingeben.");
            else if (message.toLowerCase().includes("rate") || message.toLowerCase().includes("seconds")) showToast("Bitte kurz warten, bevor du einen neuen Code anforderst.");
            else if (message.toLowerCase().includes("already") || message.toLowerCase().includes("registered")) showToast("Diese E-Mail gehört bereits zu einem Account. Melde dich mit dieser E-Mail als bestehender Nutzer an.");
            else showToast(message || "Der Code konnte nicht gesendet werden.");
          } finally {
            state.accountBusy = false;
            refreshAccountSurface();
          }
        },

        async verifyAccountCode(event) {
          event?.preventDefault();
          if (state.accountBusy) return;
          const input = document.getElementById("account-code");
          state.accountBusy = true;
          refreshAccountSurface();
          try {
            await confirmEmailOtp(input?.value || "");
            renderProfilePage();
            showToast("Account aktiviert. Deine Daten sind jetzt gesichert.");
          } catch (error) {
            console.error("OTP prüfen:", error);
            const message = String(error?.message || "");
            if (message.includes("INVALID_OTP") || message.toLowerCase().includes("token") || message.toLowerCase().includes("expired")) showToast("Der Code ist falsch oder abgelaufen.");
            else showToast(message || "Der Account konnte nicht bestätigt werden.");
          } finally {
            state.accountBusy = false;
            refreshAccountSurface();
          }
        },

        async resendAccountCode() {
          if (state.accountBusy || !state.otpEmail) return;
          state.accountBusy = true;
          refreshAccountSurface();
          try {
            await requestEmailOtp(state.otpEmail);
            showToast("Ein neuer Code wurde gesendet.");
          } catch (error) {
            console.error("OTP erneut senden:", error);
            showToast("Der Code kann noch nicht erneut gesendet werden.");
          } finally {
            state.accountBusy = false;
            refreshAccountSurface();
          }
        },

        cancelAccountCode() {
          if (state.accountBusy) return;
          state.otpSent = false;
          state.otpEmail = "";
          state.otpFlow = legacyAnonymousUser ? "upgrade" : "signin";
          refreshAccountSurface();
        },

        async syncAccountNow() {
          if (!hasVerifiedAccount() || state.accountBusy) return;
          state.accountBusy = true;
          refreshAccountSurface();
          try {
            await flushAccountSync();
            showToast("Account ist vollständig synchronisiert.");
          } catch (error) {
            console.error("Manueller Sync:", error);
            showToast("Die Synchronisierung ist fehlgeschlagen.");
          } finally {
            state.accountBusy = false;
            refreshAccountSurface();
          }
        },

        async signOutAccount() {
          if (state.accountBusy) return;
          state.accountBusy = true;
          refreshAccountSurface();
          try {
            await signOutAccount();
            showToast("Du wurdest abgemeldet.");
          } catch (error) {
            console.error("Abmelden:", error);
            state.accountBusy = false;
            refreshAccountSurface();
            showToast("Abmelden ist fehlgeschlagen.");
          }
        },

        setCategory(key) {
          if (!DATA[key] || key === state.activeCategory) return;

          state.activeCategory = key;
          const category = DATA[key];
          const tabs = document.getElementById("category-tabs");

          if (!tabs) {
            renderHome();
            return;
          }

          tabs.querySelectorAll(".clean-tab").forEach(button => {
            button.classList.toggle("active", button.dataset.category === key);
          });
          updateTabSlider(true);

          const title = document.getElementById("category-title");
          const description = document.getElementById("category-description");
          const count = document.getElementById("category-count");
          const grid = document.getElementById("exercise-grid");

          if (title) title.textContent = category.label;
          if (description) description.textContent = category.description;
          if (count) count.textContent = `${category.exercises.length} Übungen`;
          document.querySelector(".exercise-section")?.style.setProperty("--category-accent", getCategoryAccent(key));

          if (grid) {
            grid.classList.remove("tab-enter");
            grid.innerHTML = category.exercises.map(exercise => renderExerciseCard(exercise, key)).join("");
            void grid.offsetWidth;
            grid.classList.add("tab-enter");
          }
        },

        openView(view) {
          commitPendingHistory();
          state.activeExerciseId = null;
          if (view === "progress") renderProgressPage();
          else if (view === "profile") renderProfilePage();
          else renderHome();
        },

        openExercise(id) {
          const exercise = ALL_EXERCISES.find(item => item.id === id);
          if (!exercise) return;
          state.activeExerciseId = id;
          state.activeCategory = exercise.category;
          state.historyEntryValue = Number(state.values[exercise.id] || 0);
          state.historyPendingValue = state.historyEntryValue;

          // Für Rang-Aufstiege zählt der aktuell eingestellte Wert als Ausgangspunkt.
          // Der persönliche Bestwert wird weiterhin separat aus dem Verlauf ermittelt.
          // Dadurch kann ein zuvor verlorener Rang später erneut erreicht werden.
          state.momentBaselineValue = state.historyEntryValue;
          state.momentBaselineHasValue = hasStoredValue(exercise.id);
          clearTimeout(state.stepMomentTimer);
          state.pendingRankUp = null;
          renderDetail();
        },

        openFirstMissing() {
          const exercise = ALL_EXERCISES.find(item => !hasStoredValue(item.id)) || ALL_EXERCISES[0];
          this.openExercise(exercise.id);
        },

        setValue(rawValue, source) {
          const exercise = ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
          if (!exercise) return;
          const value = Math.max(0, Math.round(Number(rawValue) || 0));
          state.values[exercise.id] = value;
          saveValues();
          state.historyPendingValue = value;
          updateDetailDom(exercise, value);
        },

        finishRangeChange() {
          finalizePerformanceMoment();
        },

        finishNumberChange() {
          finalizePerformanceMoment();
        },

        stepValue(delta) {
          const exercise = ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
          if (!exercise) return;
          const oldValue = Number(state.values[exercise.id] || 0);
          const value = Math.max(0, oldValue + delta);
          state.values[exercise.id] = value;
          saveValues();
          state.historyPendingValue = value;
          updateDetailDom(exercise, value);
          schedulePerformanceMoment(exercise,620);
        },

        goHome() {
          closeRankModal();
          commitPendingHistory();
          state.activeExerciseId = null;
          renderHome();
        },

        showRanks() { showRankModal(); },
        closeRanks() { closeRankModal(); },
        toggleTheme() {
          const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
          applyTheme(current === "dark" ? "light" : "dark");
        },

        async changeProfileImage(event) {
          const file = event?.target?.files?.[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            showToast("Bitte ein Bild auswählen.");
            return;
          }

          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxSize = 512;
              const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
              const width = Math.max(1, Math.round(img.width * scale));
              const height = Math.max(1, Math.round(img.height * scale));

              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              if (!ctx) {
                showToast("Profilbild konnte nicht verarbeitet werden.");
                return;
              }

              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL("image/jpeg", .88);
              saveProfileImage(dataUrl);

              renderProfilePage();
              showToast("Profilbild aktualisiert.");
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        },

        async copyFriendCode(code) {
          try {
            await navigator.clipboard.writeText(code);
            showToast("Freundescode kopiert.");
          } catch (_) {
            showToast(`Dein Code: ${code}`);
          }
        },

        async refreshFriends() {
          try {
            await refreshFriendsDashboard(true);
          } catch (error) {
            console.error("Freunde aktualisieren:", error);
            renderFriendsError(error);
          }
        },

        async sendFriendRequest() {
          try {
            await sendFriendRequestByCode();
          } catch (error) {
            console.error("Freundesanfrage:", error);
            const message = String(error?.message || "");
            if (message.includes("FRIEND_RATE_LIMIT")) showToast("Zu viele Anfragen. Versuch es später erneut.");
            else if (message.includes("FRIEND_PENDING_LIMIT")) showToast("Du hast bereits zu viele offene Anfragen.");
            else if (message.includes("FRIEND_CODE_NOT_FOUND")) showToast("Freundescode nicht gefunden.");
            else if (message.includes("ALREADY_FRIENDS")) showToast("Ihr seid bereits befreundet.");
            else if (message.includes("REQUEST_ALREADY_PENDING")) showToast("Zwischen euch ist bereits eine Anfrage offen.");
            else showToast(message || "Freundesanfrage konnte nicht gesendet werden.");
          }
        },

        async answerFriendRequest(id, accept) {
          try {
            await answerFriendRequestOnline(id, accept);
          } catch (error) {
            console.error("Anfrage:", error);
            showToast(error?.message || "Anfrage konnte nicht verarbeitet werden.");
          }
        },

        async cancelFriendRequest(profileId) {
          try {
            await removeOnlineFriend(profileId);
          } catch (error) {
            console.error("Anfrage zurückziehen:", error);
            showToast(error?.message || "Anfrage konnte nicht zurückgezogen werden.");
          }
        },

        async openFriendProfile(id) {
          try {
            await openOnlineFriendProfile(id);
          } catch (error) {
            console.error("Freundesprofil:", error);
            showToast(error?.message || "Freundesprofil konnte nicht geladen werden.");
          }
        },

        async removeFriend(id) {
          try {
            await removeOnlineFriend(id);
          } catch (error) {
            console.error("Freund entfernen:", error);
            showToast(error?.message || "Freund konnte nicht entfernt werden.");
          }
        },

        editName() { showNameEditModal(); },
        closeNameEdit() { closeNameEditModal(); },
        saveEditedName() {
          const input = document.getElementById("name-edit-input");
          const name = saveProfileName(input?.value || "");
          if (!name) { input?.focus(); return; }
          closeNameEditModal();
          if (state.activeView === "profile") renderProfilePage();
          else if (state.activeView === "progress") renderProgressPage();
          else renderHome();
          showToast("Name aktualisiert.");
        },

        closeRankUp() { closeRankUpModal(); },
        closePersonalRecord() { closePersonalRecordModal(); },

        requestReset() { showResetModal(); },
        closeReset() { closeResetModal(); },
        async confirmReset() { await performFullReset(); },
        requestExerciseReset(exerciseId) { showExerciseResetModal(exerciseId); },
        closeExerciseReset() { closeExerciseResetModal(); },
        async confirmExerciseReset() { await confirmExerciseReset(); },

        // Abwärtskompatibel für eventuell noch offene alte Ansichten.
        resetAll() { showResetModal(); }
      };

      window.addEventListener("resize", () => updateTabSlider(false));

      applyTheme(loadTheme());
      renderBootScreen();
      bootstrapApp();
    })();
  </script>

  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker aktiv"))
        .catch(error => console.error("Service Worker Fehler:", error));
    });
  }
</script>

</body>
</html>

  .athlete-profile-actions { grid-template-columns: 1fr !important; max-width: 220px; }
