      function getAthleteArchetype() {
        const cats = CATEGORY_KEYS.map(key=>({key,info:getCategoryRank(key)})).filter(x=>!x.info.isUnranked);
        if (cats.length < 2) return {name:"Emerging Athlete",accent:"#7257f7",copy:"Dein Profil nimmt gerade Form an."};
        const byKey=Object.fromEntries(cats.map(x=>[x.key,x.info.score]));
        const vals=cats.map(x=>x.info.score), spread=Math.max(...vals)-Math.min(...vals);
        if(cats.length===4 && spread<=1.25) return {name:"The Allrounder",accent:"#7257f7",copy:"Kraft, Core und Skills entwickeln sich außergewöhnlich gleichmäßig."};
        const push=byKey.Push??-99,pull=byKey.Pull??-99,core=byKey.Core??-99,skills=byKey.Statics??-99;
        const max=Math.max(push,pull,core,skills);
        if(core>=max-.35 && skills>=max-.65) return {name:"The Controller",accent:"#18ad87",copy:"Körperspannung und technische Kontrolle prägen dein Profil."};
        if(skills===max) return {name:"The Skill Athlete",accent:"#18ad87",copy:"Statics und anspruchsvolle Skills sind deine Signatur."};
        if(push>=max-.35 && pull>=max-.35) return {name:"The Powerhouse",accent:"#7257f7",copy:"Push und Pull bilden das Kraftzentrum deines Profils."};
        const strongest=cats.sort((a,b)=>b.info.score-a.info.score)[0];
        return {name:"The Specialist",accent:getCategoryAccent(strongest.key),copy:`${DATA[strongest.key].label} hebt sich aktuell klar als deine Spezialität ab.`};
      }

      function getRoadToApex() {
        const maxSteps=ALL_EXERCISES.length*12;
        const steps=ALL_EXERCISES.reduce((sum,e)=>sum+Math.max(0,getRankInfo(Number(state.values[e.id]||0),e.t).idx),0);
        return {steps,maxSteps,percent:Math.round(steps/maxSteps*100)};
      }

      function getNextGoal() {
        // Ziele laufen bewusst wie ein fester 23er-Kreis durch die App:
        // erst jede Übung auf Basis I, danach jede auf Basis II usw.
        // So wird keine einzelne Lieblingsübung mehrere Ränge vorausgezogen.
        for (let targetRank = 1; targetRank < RANKS.length; targetRank += 1) {
          const roundItems = ALL_EXERCISES.map((exercise, index) => {
            const value = Number(state.values[exercise.id] || 0);
            const info = getRankInfo(value, exercise.t, hasStoredValue(exercise.id));
            return { exercise, index, value, info };
          });

          const next = roundItems.find(item => item.info.idx < targetRank);
          if (!next) continue;

          const target = next.exercise.t[targetRank - 1];
          const lower = targetRank <= 1 ? 0 : next.exercise.t[targetRank - 2];
          const missing = Math.max(0, target - next.value);
          const ratio = clamp((next.value - lower) / Math.max(1, target - lower), 0, 1);
          const completedInRound = roundItems.filter(item => item.info.idx >= targetRank).length;

          return {
            ...next,
            targetRank,
            targetRankInfo: RANKS[targetRank],
            target,
            lower,
            missing,
            ratio,
            completedInRound,
            position: completedInRound + 1,
            total: ALL_EXERCISES.length
          };
        }

        return null;
      }

      function rankBadge(rankInfo, size = 112, progressOverride = null) {
        const progress = progressOverride === null ? rankInfo.progress : progressOverride;
        const radius = 56;
        const circumference = 2 * Math.PI * radius;
        const dashOffset = circumference * (1 - clamp(progress, 0, 100) / 100);
        const safeIndex = rankInfo.isUnranked ? 0 : clamp(Number(rankInfo.idx) || 0, 0, 12);
        const uid = `rank-${rankInfo.isUnranked ? "open" : safeIndex}-${++rankBadgeUid}`;

        const glowId = `${uid}-glow`;
        const shineId = `${uid}-shine`;

          return `<line class="rank-tick" x1="64" y1="3.5" x2="64" y2="7.5" transform="rotate(${angle} 64 64)"/>`;
        }).join("");
        const artwork = rankInfo.isUnranked ? unrankedArtwork() : rankArtwork(safeIndex);
        const levelText = rankInfo.isUnranked ? "OFFEN" : `LEVEL ${String(safeIndex).padStart(2, "0")}`;

        return `
          <svg class="rank-badge" width="${size}" height="${size}" viewBox="0 0 128 128" aria-hidden="true"
               style="--rank-accent:${rankInfo.accent};--rank-deep:${rankInfo.deep}">

                  </div>

                  <span class="overall-card-arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M8 5L15 12L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

      function updateTabSlider(animate = true) {
        const tabs = document.getElementById("category-tabs");
        if (!tabs) return;
        const active = tabs.querySelector(".clean-tab.active");
        if (!active) return;

        const target = active.offsetLeft - 5;
        if (!animate) {
          tabs.style.setProperty("--tab-slide", `${target}px`);
        } else {
          requestAnimationFrame(() => tabs.style.setProperty("--tab-slide", `${target}px`));
        }
      }

      function renderExerciseCard(exercise, categoryKey) {
        const value = Number(state.values[exercise.id] || 0);
        const hasValue = hasStoredValue(exercise.id);
        const info = getRankInfo(value, exercise.t, hasValue);
        const visualAccent = getVisualAccent(info, categoryKey);
        const displayValue = hasValue ? formatValue(value, exercise.type) : "Noch offen";
        const rankName = hasValue ? info.name : "Nicht bewertet";

        return `
          <button class="exercise-card" type="button" onclick="caliApp.openExercise('${exercise.id}')"
                  style="--card-accent:${visualAccent};--art-accent:${getCategoryAccent(categoryKey)}">

            <span class="card-main">
              <span class="card-meta-line">
                <span class="card-kicker">${escapeHtml(DATA[categoryKey].kicker)}</span>
                <span class="card-status">${hasValue ? "Erfasst" : "Start"}</span>
              </span>
              <span class="card-title">${escapeHtml(exercise.name)}</span>

            <span class="card-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M8 5L15 12L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </button>`;
      }

      function renderDetail() {
        const exercise = ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
        if (!exercise) {

          renderHome();

        }

        const hasValue = hasStoredValue(exercise.id);
        const value = Number(state.values[exercise.id] || 0);
        const info = getRankInfo(value, exercise.t, hasValue);
        const sliderMax = Math.max(Math.round(exercise.t[exercise.t.length - 1] * 1.25), value, 1);
        const category = DATA[exercise.category];
        const visualAccent = getVisualAccent(info, exercise.category);

        document.documentElement.style.setProperty("--accent", visualAccent);
        document.documentElement.style.setProperty("--accent-deep", info.deep);

        document.getElementById("app").innerHTML = `
          <div class="app detail-view">
            <header class="detail-top">
              <button class="back-button" type="button" onclick="caliApp.goHome()">

                ${themeToggleMarkup()}
                ${brandMarkup()}
              </div>

            <div class="detail-grid">
              <section class="detail-art-card" style="--detail-accent:${getCategoryAccent(exercise.category)};--art-accent:${visualAccent}">

                  <div class="detail-category-chip">${escapeHtml(category.kicker)}</div>
                  <h1>${escapeHtml(exercise.name)}</h1>
                  <p>${exercise.type === "time" ? "Saubere Haltezeit in Sekunden" : "Saubere Wiederholungen ohne Technikverlust"}</p>
                </div>
                <div class="detail-art-stage" aria-hidden="true">${exerciseImage(exercise)}</div>
              </section>

              <aside class="detail-side">
                <section class="rank-card" id="rank-card" style="--detail-accent:${visualAccent}">

                  <div class="rank-card-copy">
                    <div class="rank-card-kicker">Aktueller Rang</div>

                    <div class="rank-card-text" id="detail-rank-text">${escapeHtml(rankProgressText(info, exercise))}</div>
                    <div class="progress-track"><div class="progress-fill" id="detail-rank-progress" style="--progress-color:${visualAccent};width:${info.progress}%"></div></div>
                  </div>
                </section>

                <section class="input-card">
                  <div class="input-head">
                    <div>
                      <div class="input-label">${exercise.type === "time" ? "Deine Bestzeit" : "Dein Bestwert"}</div>
                      <div class="big-value" id="detail-value">${hasValue ? escapeHtml(formatValue(value, exercise.type)) : "Noch offen"}</div>
                    </div>
                    <div class="stepper">
                      <button class="step-button" type="button" onclick="caliApp.stepValue(-1)" aria-label="Wert um eins verringern">−</button>
                      <button class="step-button" type="button" onclick="caliApp.stepValue(1)" aria-label="Wert um eins erhöhen">+</button>
                    </div>

                  <div class="range-wrap">
                    <input id="value-range" type="range" min="0" max="${sliderMax}" step="1" value="${value}"
                           aria-label="Bestwert einstellen"
                           style="--slider-accent:${visualAccent};--slider-progress:${(value / sliderMax) * 100}%"
                           oninput="caliApp.setValue(this.value, 'range')"
                           onchange="caliApp.finishRangeChange()">
                    <div class="range-meta">
                      <span>0</span>
                      <input id="value-number" class="number-field" type="number" min="0" step="1" value="${hasValue ? value : ""}" placeholder="0"
                             aria-label="Bestwert als Zahl"
                             onchange="caliApp.setValue(this.value, 'number')"
                             oninput="caliApp.setValue(this.value, 'number')">
                      <span id="range-max">${sliderMax}</span>

                </div>
                <div class="threshold-list" id="threshold-list">
                  ${renderThresholds(exercise, value, info)}
                </div>
              </section>
              ${renderHistory(exercise)}
            </div>
          </div>`;

        window.scrollTo({ top: 0, behavior: "auto" });
      }

      function rankProgressText(info, exercise) {
        if (info.isUnranked) return "Noch kein Wert eingetragen.";
        if (!info.next || info.upper === null) return "Höchster Rang dieser Übung erreicht.";
        const missing = Math.max(0, info.upper - Number(state.values[exercise.id] || 0));
        const target = exercise.type === "time" ? formatTime(info.upper) : `${info.upper} Wdh.`;
        if (missing === 0) return `${info.next.name} ist erreicht.`;
        return `${target} für ${info.next.name}.`;
      }

      function renderThresholds(exercise, value, currentInfo) {
        return exercise.t.map((threshold, index) => {
          const rank = RANKS[index + 1];
          const reached = value >= threshold;
          const current = currentInfo.idx === index + 1;
          const label = exercise.type === "time" ? formatTime(threshold).replace(" Min.", "") : threshold;
          return `
            <div class="threshold ${reached ? "reached" : ""} ${current ? "current" : ""}"
                 style="--threshold-accent:${rank.accent}">
              <div class="threshold-rank">${escapeHtml(rank.name)}</div>
              <div class="threshold-value">${escapeHtml(label)}${exercise.type === "reps" ? "×" : ""}</div>
            </div>`;
        }).join("");
      }

      function updateDetailDom(exercise, value) {
        const info = getRankInfo(value, exercise.t, true);
        const visualAccent = getVisualAccent(info, exercise.category);
        const range = document.getElementById("value-range");
        const number = document.getElementById("value-number");
        const baseMax = Math.round(exercise.t[exercise.t.length - 1] * 1.25);
        const max = Math.max(baseMax, value, 1);

        if (!range || !number) return;

        range.max = String(max);
        range.value = String(value);
        number.value = String(value);
        range.style.setProperty("--slider-accent", visualAccent);
        range.style.setProperty("--slider-progress", `${(value / max) * 100}%`);

        const rangeMax = document.getElementById("range-max");
        if (rangeMax) rangeMax.textContent = String(max);

        const display = document.getElementById("detail-value");
        const badge = document.getElementById("detail-badge");
        const rankName = document.getElementById("detail-rank-name");
        const rankText = document.getElementById("detail-rank-text");
        const rankProgress = document.getElementById("detail-rank-progress");
        const rankCard = document.getElementById("rank-card");
        const artCard = document.querySelector(".detail-art-card");
        const thresholds = document.getElementById("threshold-list");

        if (display) display.textContent = formatValue(value, exercise.type);
        if (badge) badge.innerHTML = rankBadge(info, 128);
        if (rankName) { rankName.textContent = info.name; rankName.style.color = visualAccent; }
        if (rankText) rankText.textContent = rankProgressText(info, exercise);
        if (rankProgress) { rankProgress.style.width = `${info.progress}%`; rankProgress.style.setProperty("--progress-color", visualAccent); }
        if (rankCard) rankCard.style.setProperty("--detail-accent", visualAccent);
        if (artCard) artCard.style.setProperty("--art-accent", visualAccent);
        if (thresholds) thresholds.innerHTML = renderThresholds(exercise, value, info);

        document.documentElement.style.setProperty("--accent", visualAccent);
        document.documentElement.style.setProperty("--accent-deep", info.deep);
      }

      function showRankModal() {
        const overall = getOverallRank();
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.id = "rank-modal";
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        modal.setAttribute("aria-labelledby", "rank-modal-title");
        modal.onclick = event => {
          if (event.target === modal) closeRankModal();
        };

        modal.innerHTML = `
          <section class="modal-panel">
            <header class="modal-head">
              <div>
                <h2 id="rank-modal-title">Rangsystem</h2>
                <p>13 klar aufgebaute Stufen mit eigenständiger Form- und Farbwelt.</p>
              </div>
              <button class="icon-button" type="button" onclick="caliApp.closeRanks()" aria-label="Rangsystem schließen">
                <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
            </header>
            <div class="rank-grid">
              ${RANKS.map((rank, idx) => {
                const info = { idx, ...rank, progress: 100 };
                const currentIdx = overall.isUnranked ? 0 : overall.idx;
                const isReached = idx < currentIdx;
                const isActive = idx === currentIdx;
                const isLocked = idx > currentIdx;
                const stateClass = isActive ? "active" : (isReached ? "reached" : "locked");
                const stateLabel = isActive ? "Aktueller Rang" : (isReached ? "Erreicht" : "Gesperrt");
                return `
                  <div class="rank-grid-item ${stateClass}" style="--item-accent:${rank.accent}" aria-label="${escapeHtml(rank.name)} · ${stateLabel}">
                    ${isLocked ? `<span class="rank-grid-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="6.5" y="10.5" width="11" height="9" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M9 10.5V8a3 3 0 0 1 6 0v2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>` : ""}
                    ${rankBadge(info, 88, 100)}
                    <div class="rank-grid-name">${escapeHtml(rank.name)}</div>
                    <div class="rank-grid-level">Level ${String(idx).padStart(2, "0")}</div>
                    <div class="rank-grid-state">${stateLabel}</div>
                  </div>`;
              }).join("")}
            </div>
          </section>`;

        document.body.appendChild(modal);
        document.body.style.overflow = "hidden";
        modal.querySelector("button")?.focus();
      }

        document.body.style.overflow = "";
      }

      function showToast(message) {
        document.querySelector(".app-toast")?.remove();
        const toast = document.createElement("div");
        toast.className = "app-toast";
        toast.setAttribute("role", "status");
        toast.textContent = message;
        document.body.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("visible"));
        window.setTimeout(() => {
          toast.classList.remove("visible");
          window.setTimeout(() => toast.remove(), 230);
        }, 2200);
      }

      function performFullReset() {
        // 1. Laufenden Zustand leeren.
        state.values = {};
        state.activeExerciseId = null;
        state.activeCategory = CATEGORY_KEYS[0];
        state.name = "";
        state.profileImage = "";
        state.history = {};
        state.historyEntryValue = null;
        state.historyPendingValue = null;
        state.pendingRankUp = null;
        preparedStrengthCardFile = null;
        preparedStrengthCardPromise = null;

        // 2. Trainingswerte und persönliches Profil vollständig löschen.
        clearAllStoredValues();
        try {
          localStorage.removeItem(PROFILE_KEY);
          localStorage.removeItem(PROFILE_IMAGE_KEY);
          localStorage.removeItem(HISTORY_KEY);
        } catch (_) {}

        // 3. Auch die anonyme Online-Identität zurücksetzen.
        try {
          const sb = getSupabase();
          if (sb) sb.auth.signOut().catch(() => {});
          socialUser = null;
        } catch (_) {}

        // 4. Dialog schließen und die komplette Oberfläche aus leerem Zustand neu aufbauen.
        closeResetModal();
        closeRankModal();
        renderWelcome();
      }

      window.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (document.getElementById("rankup-modal")) closeRankUpModal();
          else if (document.getElementById("name-edit-modal")) closeNameEditModal();
          else if (document.getElementById("reset-modal")) closeResetModal();
          else if (document.getElementById("rank-modal")) closeRankModal();
          else if (state.activeExerciseId) {
            commitPendingHistory();
            state.activeExerciseId = null;
            renderHome();
          }
        }
      });

      window.caliApp = {
        completeProfile(event) {
          event?.preventDefault();
          const input = document.getElementById("welcome-name");
          const name = saveProfileName(input?.value || "");
          if (!name) {
            input?.focus();
            input?.animate?.([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 220 });
            return;
          }
          renderHome();
        },

        setCategory(key) {
          if (!DATA[key] || key === state.activeCategory) return;

          state.activeCategory = key;
          const category = DATA[key];
          const tabs = document.getElementById("category-tabs");

          if (!tabs) {
            renderHome();
            return;
          }

          tabs.querySelectorAll(".clean-tab").forEach(button => {
            button.classList.toggle("active", button.dataset.category === key);
          });
          updateTabSlider(true);

          const title = document.getElementById("category-title");
          const description = document.getElementById("category-description");
          const count = document.getElementById("category-count");
          const grid = document.getElementById("exercise-grid");

          if (title) title.textContent = category.label;
          if (description) description.textContent = category.description;
          if (count) count.textContent = `${category.exercises.length} Übungen`;
          document.querySelector(".exercise-section")?.style.setProperty("--category-accent", getCategoryAccent(key));

          if (grid) {
            grid.classList.remove("tab-enter");
            grid.innerHTML = category.exercises.map(exercise => renderExerciseCard(exercise, key)).join("");
            void grid.offsetWidth;
            grid.classList.add("tab-enter");
          }
        },

        openView(view) {
          commitPendingHistory();
          state.activeExerciseId = null;
          if (view === "progress") renderProgressPage();
          else if (view === "profile") renderProfilePage();
          else renderHome();
        },

        openExercise(id) {
          const exercise = ALL_EXERCISES.find(item => item.id === id);
          if (!exercise) return;
          state.activeExerciseId = id;
          state.activeCategory = exercise.category;
          state.historyEntryValue = Number(state.values[exercise.id] || 0);
          state.historyPendingValue = state.historyEntryValue;
          state.pendingRankUp = null;
          renderDetail();
        },

        openFirstMissing() {
          const exercise = ALL_EXERCISES.find(item => !hasStoredValue(item.id)) || ALL_EXERCISES[0];
          this.openExercise(exercise.id);
        },

        setValue(rawValue, source) {
          const exercise = ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
          if (!exercise) return;

          const oldHasValue = hasStoredValue(exercise.id);
          const oldValue = Number(state.values[exercise.id] || 0);
          const oldInfo = getRankInfo(oldValue, exercise.t, oldHasValue);
          const value = Math.max(0, Math.round(Number(rawValue) || 0));

          state.values[exercise.id] = value;
          saveValues();
          state.historyPendingValue = value;
          updateDetailDom(exercise, value);

          const newInfo = getRankInfo(value, exercise.t, true);

          // Beim Ziehen des Reglers Rangaufstieg nur vormerken.
          // Angezeigt wird er erst, wenn der Regler losgelassen wurde.
          if (source === "range") {
            if (newInfo.idx > oldInfo.idx && value > oldValue) {
              state.pendingRankUp = { exercise, info: newInfo, value };
            } else if (state.pendingRankUp) {
              // Beim Zurückziehen immer den tatsächlich aktuell erreichten Rang merken.
              const pendingStartInfo = getRankInfo(
                Number(state.historyEntryValue || 0),
                exercise.t,
                state.historyEntryValue !== null
              );

              if (newInfo.idx > pendingStartInfo.idx && value > Number(state.historyEntryValue || 0)) {
                state.pendingRankUp = { exercise, info: newInfo, value };
              } else {
                state.pendingRankUp = null;
              }
            }
            return;
          }

          // Zahleneingabe bleibt wie bisher direkt.
          if (newInfo.idx > oldInfo.idx && value > oldValue) {
            showRankUpMoment(exercise, newInfo, value);
          }
        },

        finishRangeChange() {
          if (!state.pendingRankUp) return;

          const { exercise, info, value } = state.pendingRankUp;
          state.pendingRankUp = null;
          showRankUpMoment(exercise, info, value);
        },

        stepValue(delta) {
          const exercise = ALL_EXERCISES.find(item => item.id === state.activeExerciseId);
          if (!exercise) return;
          const oldHasValue = hasStoredValue(exercise.id);
          const oldValue = Number(state.values[exercise.id] || 0);
          const oldInfo = getRankInfo(oldValue, exercise.t, oldHasValue);
          const value = Math.max(0, oldValue + delta);
          state.values[exercise.id] = value;
          saveValues();
          state.historyPendingValue = value;
          updateDetailDom(exercise, value);
          const newInfo = getRankInfo(value, exercise.t, true);
          if (newInfo.idx > oldInfo.idx && value > oldValue) showRankUpMoment(exercise, newInfo, value);
        },

        goHome() {
          closeRankModal();
          commitPendingHistory();
          state.activeExerciseId = null;
          renderHome();
        },

        showRanks() { showRankModal(); },
        closeRanks() { closeRankModal(); },

        toggleTheme() {
          const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
          applyTheme(current === "dark" ? "light" : "dark", true);
        },

        showShareCard() { showShareCard(); },
        async shareProfile() {
          try {
            // Idealfall: Die Card wurde beim Öffnen des Modals bereits fertig erzeugt.
            // navigator.share() wird dann direkt aus dem Button-Klick heraus aufgerufen.
            let file = preparedStrengthCardFile;

            // Falls die Vorbereitung extrem knapp noch läuft, warten wir kurz auf sie.
            if (!file && preparedStrengthCardPromise) {
              file = await preparedStrengthCardPromise;
            }

            if (!file) {
              showToast("Strength Card wird noch vorbereitet.");
              return;
            }

            if (!navigator.share) {
              showToast("Der native Teilen-Dialog wird auf diesem Gerät nicht unterstützt.");
              return;
            }

            if (typeof navigator.canShare === "function" && !navigator.canShare({ files: [file] })) {
              showToast("Dieses Gerät kann die Strength Card nicht als Datei teilen.");
              return;
            }

            await navigator.share({
              title: "Clastanic Strength Card",
              files: [file]
            });
          } catch (error) {
            // Abbrechen im nativen Teilen-Menü ist kein Fehler.
            if (error?.name === "AbortError") return;

            console.error("Strength Card Share Fehler:", error);
            showToast("Der Teilen-Dialog konnte nicht geöffnet werden.");
          }
        },

        async changeProfileImage(event) {
          const file = event?.target?.files?.[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            showToast("Bitte ein Bild auswählen.");
            return;
          }

          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxSize = 512;
              const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
              const width = Math.max(1, Math.round(img.width * scale));
              const height = Math.max(1, Math.round(img.height * scale));

              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              if (!ctx) {
                showToast("Profilbild konnte nicht verarbeitet werden.");
                return;
              }

              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL("image/jpeg", .88);
              saveProfileImage(dataUrl);
              preparedStrengthCardFile = null;
              preparedStrengthCardPromise = null;
              renderProfilePage();
              showToast("Profilbild aktualisiert.");
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        },

        async copyFriendCode(code) {
          try {
            await navigator.clipboard.writeText(code);
            showToast("Freundescode kopiert.");
          } catch (_) {
            showToast(`Dein Code: ${code}`);
          }
        },

        async sendFriendRequest() {
          try {
            await sendFriendRequestByCode();
          } catch (error) {
            console.error(error);
            showToast("Freundesanfrage konnte nicht gesendet werden.");
          }
        },

        async answerFriendRequest(id, accept) {
          try {
            await answerFriendRequestOnline(id, accept);
          } catch (error) {
            console.error(error);
            showToast("Anfrage konnte nicht verarbeitet werden.");
          }
        },

        async openFriendProfile(id) {
          try {
            await openOnlineFriendProfile(id);
          } catch (error) {
            console.error(error);
            showToast("Freundesprofil konnte nicht geladen werden.");
          }
        },

        async removeFriend(id) {
          try {
            await removeOnlineFriend(id);
          } catch (error) {
            console.error(error);
            showToast("Freund konnte nicht entfernt werden.");
          }
        },

        editName() { showNameEditModal(); },
        closeNameEdit() { closeNameEditModal(); },
        saveEditedName() {
          const input = document.getElementById("name-edit-input");
          const name = saveProfileName(input?.value || "");
          if (!name) { input?.focus(); return; }
          closeNameEditModal();
          if (state.activeView === "profile") renderProfilePage();
          else if (state.activeView === "progress") renderProgressPage();
          else renderHome();
          showToast("Name aktualisiert.");
        },

        closeRankUp() { closeRankUpModal(); },

        requestReset() { showResetModal(); },
        closeReset() { closeResetModal(); },
        confirmReset() { performFullReset(); },

        // Abwärtskompatibel für eventuell noch offene alte Ansichten.
        resetAll() { showResetModal(); }
      };

      window.addEventListener("resize", () => updateTabSlider(false));

      applyTheme(loadTheme(), false);
      renderHome();
    })();
  </script>

  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker aktiv"))
        .catch(error => console.error("Service Worker Fehler:", error));
    });
  }
</script>
