<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7257f7">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <title>CalisthenX</title>
  <style>

    :root {
      --page: #0d0b15;
      --surface: #f4f3f7;
      --surface-2: #ebe9f0;
      --card: #ffffff;
      --card-soft: #f8f7fa;
      --ink: #111116;
      --ink-soft: #35343d;
      --muted: #777681;
      --muted-2: #aaa8b1;
      --line: #e3e1e8;
      --line-strong: #d4d1dc;
      --brand: #7257f7;
      --brand-2: #a889ff;
      --brand-deep: #4f35dc;
      --accent: #7257f7;
      --accent-deep: #352871;
      --success: #1fa675;
      --danger: #d84c57;
      --shadow-lg: 0 34px 100px rgba(5, 4, 12, .28);
      --shadow-card: 0 16px 38px rgba(29, 23, 62, .08);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 5%, rgba(125, 91, 255, .31), transparent 31rem),
        radial-gradient(circle at 86% 18%, rgba(176, 129, 255, .22), transparent 28rem),
        linear-gradient(145deg, #171224 0%, #0d0b15 48%, #08070d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.82), transparent 75%);
      content: "";
    }

    button,
    input { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(114, 87, 247, .28);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      width: min(1180px, calc(100% - 36px));
      min-height: calc(100vh - 36px);
      margin: 18px auto;
      padding: 0 30px max(58px, env(safe-area-inset-bottom));
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 36px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }

    .topbar,
    .detail-top {
      position: relative;
      z-index: 30;
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: max(15px, env(safe-area-inset-top)) 2px 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border-radius: 13px;
      background: linear-gradient(145deg, #8b72ff, #5b3fe7);
      box-shadow: 0 8px 18px rgba(91, 63, 231, .27);
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      width: 18px;
      height: 5px;
      border-radius: 999px;
      background: #fff;
      content: "";
      transform: rotate(-45deg);
    }

    .brand-mark::before { translate: -4px -4px; }
    .brand-mark::after { translate: 4px 4px; opacity: .58; }

    .brand-copy { line-height: 1; }

    .brand-name {
      display: block;
      font-size: 14px;
      font-weight: 820;
      letter-spacing: .095em;
    }

    .brand-sub {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .08em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-button,
    .quiet-button,
    .primary-button,
    .step-button,
    .back-button,
    .danger-button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink-soft);
      background: var(--card);
      box-shadow: 0 8px 22px rgba(31, 25, 62, .08);
      transition: transform .22s var(--ease), border-color .2s ease, box-shadow .2s ease;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      box-shadow: 0 12px 28px rgba(31, 25, 62, .13);
      transform: translateY(-2px);
    }

    .icon-button:active { transform: translateY(0) scale(.96); }
    .icon-button svg { width: 19px; height: 19px; }

    /* Home hero */
    .home-hero {
      --hero-rank-accent: var(--brand);
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr);
      min-height: 418px;
      align-items: stretch;
      gap: 28px;
      padding: 42px;
      overflow: hidden;
      border-radius: 32px;
      color: #fff;
      background:
        radial-gradient(circle at 82% 20%, rgba(255,255,255,.20), transparent 15rem),
        linear-gradient(135deg, #6d4ff2 0%, #805cf9 48%, #9f75ff 100%);
      box-shadow: 0 28px 54px rgba(90, 60, 215, .25);
    }

    .home-hero::before {
      position: absolute;
      width: 430px;
      height: 430px;
      right: -170px;
      bottom: -250px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      box-shadow:
        0 0 0 42px rgba(255,255,255,.045),
        0 0 0 88px rgba(255,255,255,.025);
      content: "";
    }

    .home-hero::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(90deg, rgba(0,0,0,.65), transparent 86%);
      content: "";
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: 8px 0;
    }

    .hero-eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;
      color: rgba(255,255,255,.86);
      background: rgba(255,255,255,.10);
      font-size: 10px;
      font-weight: 780;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .hero-eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 5px rgba(255,255,255,.12);
      content: "";
    }

    .home-hero h1 {
      max-width: 660px;
      margin: 24px 0 0;
      font-size: clamp(46px, 6.2vw, 76px);
      font-weight: 820;
      letter-spacing: -.062em;
      line-height: .93;
    }

    .home-hero h1 span {
      color: rgba(255,255,255,.62);
      font-weight: 690;
    }

    .hero-description {
      max-width: 560px;
      margin: 21px 0 0;
      color: rgba(255,255,255,.77);
      font-size: 14px;
      line-height: 1.65;
    }

    .hero-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .hero-metric {
      min-width: 128px;
      padding: 13px 15px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 17px;
      background: rgba(255,255,255,.10);
    }

    .hero-metric strong {
      display: block;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.025em;
      font-variant-numeric: tabular-nums;
    }

    .hero-metric span {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.64);
      font-size: 10px;
      font-weight: 650;
    }

    .overall-card {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 100%;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      padding: 24px;
      border: 0;
      border-radius: 28px;
      color: var(--ink);
      background: rgba(255,255,255,.96);
      box-shadow: 0 22px 46px rgba(47, 28, 124, .22);
      cursor: pointer;
      transition: transform .28s var(--ease), box-shadow .28s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .overall-card:hover {
      box-shadow: 0 28px 56px rgba(47, 28, 124, .28);
      transform: translateY(-4px) rotate(.25deg);
    }

    .overall-card:active { transform: translateY(-1px) scale(.985); }

    .overall-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 780;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .overall-card-arrow {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
    }

    .overall-card-arrow svg { width: 15px; height: 15px; }

    .overall-ring {
      position: relative;
      display: grid;
      width: 172px;
      height: 172px;
      align-self: center;
      margin: 8px 0;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 0 65%, transparent 66%),
        conic-gradient(var(--hero-rank-accent) var(--overall-progress, 0%), #ece9f3 0);
      box-shadow: inset 0 0 0 1px #ebe8f0;
    }

    .overall-ring::after {
      position: absolute;
      inset: 12px;
      border: 1px solid #eeebf3;
      border-radius: 50%;
      content: "";
    }

    .overall-ring-copy {
      position: relative;
      z-index: 1;
      display: flex;
      width: 124px;
      height: 124px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      text-align: center;
    }

    .overall-ring-copy small {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .overall-ring-copy strong {
      max-width: 105px;
      margin-top: 7px;
      overflow: hidden;
      color: var(--hero-rank-accent);
      font-size: 18px;
      font-weight: 820;
      letter-spacing: -.03em;
      line-height: 1.02;
      text-overflow: ellipsis;
    }

    .overall-card-foot {
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    /* Category navigation */
    .exercise-section { padding-top: 30px; }

    .clean-tabs-wrap {
      position: relative;
      overflow: visible;
    }

    .clean-tabs {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
      min-width: 0;
      gap: 4px;
      padding: 5px;
      overflow: hidden;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(135deg, #6a4fee, #8060f7);
      box-shadow: 0 16px 32px rgba(92, 61, 220, .18);
      isolation: isolate;
    }

    .clean-tabs::before {
      position: absolute;
      z-index: 0;
      top: 5px;
      bottom: 5px;
      left: 5px;
      width: calc((100% - 22px) / 4);
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(47, 31, 115, .22);
      content: "";
      transform: translateX(var(--tab-slide, 0px));
      transition: transform .38s var(--ease);
      will-change: transform;
    }

    .clean-tab {
      position: relative;
      z-index: 1;
      min-height: 54px;
      padding: 0 14px;
      border: 0;
      border-radius: 17px;
      color: rgba(255,255,255,.73);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 710;
      letter-spacing: -.01em;
      transition: color .22s ease, transform .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .clean-tab:hover { color: #fff; }
    .clean-tab:active { transform: scale(.97); }
    .clean-tab.active { color: var(--ink); }

    .clean-section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 34px 4px 17px;
    }

    .clean-section-head > div { min-width: 0; }

    .clean-section-head h2 {
      margin: 7px 0 0;
      font-size: 31px;
      font-weight: 790;
      letter-spacing: -.045em;
    }

    .clean-section-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .category-count {
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.62);
      font-size: 10px;
      font-weight: 720;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      animation: gridIn .36s var(--ease) both;
    }

    .exercise-grid.tab-enter { animation: tabContentIn .32s var(--ease) both; }

    @keyframes gridIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tabContentIn {
      from { opacity: .15; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .exercise-card {
      --card-accent: var(--brand);
      --art-accent: var(--card-accent);
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 58px 42px;
      min-height: 148px;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 13px 14px 13px 13px;
      border: 1px solid rgba(218, 215, 226, .84);
      border-radius: 24px;
      color: var(--ink);
      background: var(--card);
      box-shadow: var(--shadow-card);
      text-align: left;
      cursor: pointer;
      transition: transform .28s var(--ease), box-shadow .25s ease, border-color .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .exercise-card:hover {
      border-color: color-mix(in srgb, var(--card-accent) 28%, var(--line-strong));
      box-shadow: 0 23px 48px rgba(31, 24, 67, .13);
      transform: translateY(-4px);
    }

    .exercise-card:active { transform: translateY(-1px) scale(.992); }

    .art-panel {
      position: relative;
      display: grid;
      width: 112px;
      height: 120px;
      place-items: center;
      overflow: hidden;
      border-radius: 20px;
      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,.94), transparent 32%),
        linear-gradient(145deg, color-mix(in srgb, var(--art-accent) 18%, #f6f5fa), #eeecf3);
    }

    .art-panel::before {
      position: absolute;
      width: 90px;
      height: 90px;
      right: -42px;
      bottom: -42px;
      border: 1px solid color-mix(in srgb, var(--art-accent) 28%, transparent);
      border-radius: 50%;
      box-shadow: 0 0 0 18px color-mix(in srgb, var(--art-accent) 7%, transparent);
      content: "";
    }

    .art-panel::after {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--art-accent);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--art-accent) 12%, transparent);
      content: "";
    }

    .exercise-art {
      position: relative;
      z-index: 1;
      display: block;
      width: 106px;
      height: 106px;
      object-fit: cover;
      object-position: center;
      overflow: hidden;
      border-radius: 17px;
      background: #fff;
      transition: transform .28s var(--ease);
    }

    .exercise-card:hover .exercise-art { transform: scale(1.035); }

    .card-main { min-width: 0; }

    .card-meta-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-kicker {
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .card-status {
      flex: 0 0 auto;
      padding: 5px 7px;
      border-radius: 999px;
      color: var(--card-accent);
      background: color-mix(in srgb, var(--card-accent) 10%, #fff);
      font-size: 8px;
      font-weight: 780;
      letter-spacing: .03em;
    }

    .card-title {
      display: block;
      margin-top: 8px;
      overflow: hidden;
      font-size: 18px;
      font-weight: 770;
      letter-spacing: -.03em;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 11px;
    }

    .rank-label {
      overflow: hidden;
      color: var(--card-accent);
      font-size: 10px;
      font-weight: 780;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .value-label {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .mini-progress {
      display: block;
      width: 100%;
      height: 5px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: #eceaf0;
    }

    .mini-progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--card-accent), color-mix(in srgb, var(--card-accent) 55%, #ffffff));
      transition: width .42s var(--ease);
    }

    .card-badge {
      display: grid;
      place-items: center;
    }

    .card-arrow {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      transition: transform .25s var(--ease), background .2s ease;
    }

    .exercise-card:hover .card-arrow {
      background: var(--card-accent);
      transform: translateX(3px);
    }

    .card-arrow svg { width: 17px; height: 17px; }

    .empty-state {
      grid-column: 1 / -1;
      padding: 50px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: 24px;
      color: var(--muted);
      background: rgba(255,255,255,.48);
      text-align: center;
    }

    /* =========================================================
       PNG-Rangabzeichen – einheitlich in allen App-Bereichen
       ========================================================= */
    .rank-badge {
      display: block;
      max-width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: drop-shadow(0 10px 18px rgba(24, 18, 48, .20));
      transform: translateZ(0);
      transform-origin: center;
      transition:
        transform .28s var(--ease),
        filter .28s ease,
        opacity .22s ease;
    }

    /* Ohne erfasste Werte wird Start nur als dezente Vorschau gezeigt. */
    .rank-badge.is-unranked {
      opacity: .38;
      filter:
        grayscale(1)
        saturate(.22)
        drop-shadow(0 7px 13px rgba(24, 18, 48, .12));
    }

    /* In den Übungskarten bleibt das Abzeichen kompakt und ruhig. */
    .card-badge .rank-badge {
      width: 56px;
      height: 56px;
    }

    .exercise-card:hover .card-badge .rank-badge:not(.is-unranked) {
      transform: translateY(-1px) scale(1.045);
    }

    .rank-grid-item:hover .rank-badge:not(.is-unranked) {
      transform: translateY(-2px) scale(1.045);
    }

    .rank-grid-item.active .rank-badge {
      filter:
        drop-shadow(0 11px 18px rgba(24, 18, 48, .18))
        drop-shadow(0 0 15px color-mix(in srgb, var(--item-accent) 30%, transparent));
    }

    /* Detail page */
    .detail-view { animation: pageIn .4s var(--ease) both; }

    @keyframes pageIn {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .detail-top {
      min-height: 78px;
      padding-bottom: 13px;
    }

    .back-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      padding: 0 15px 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      background: var(--card);
      box-shadow: 0 8px 20px rgba(31,25,62,.07);
      font-size: 12px;
      font-weight: 700;
      transition: transform .22s var(--ease), box-shadow .2s ease;
    }

    .back-button:hover {
      box-shadow: 0 12px 25px rgba(31,25,62,.11);
      transform: translateX(-3px);
    }

    .back-button svg { width: 16px; height: 16px; }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(330px, .82fr);
      gap: 16px;
      align-items: stretch;
    }

    .detail-art-card {
      --detail-accent: var(--brand);
      position: relative;
      min-height: 500px;
      overflow: hidden;
      border-radius: 32px;
      color: #fff;
      background:
        radial-gradient(circle at 78% 24%, rgba(255,255,255,.22), transparent 14rem),
        linear-gradient(145deg, var(--detail-accent), color-mix(in srgb, var(--detail-accent) 62%, #6d4ff2));
      box-shadow: 0 28px 54px color-mix(in srgb, var(--detail-accent) 24%, transparent);
    }

    .detail-art-card::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.66), transparent 92%);
      content: "";
    }

    .detail-art-card::after {
      position: absolute;
      width: 330px;
      height: 330px;
      right: -135px;
      bottom: -170px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 50%;
      box-shadow: 0 0 0 46px rgba(255,255,255,.045), 0 0 0 92px rgba(255,255,255,.025);
      content: "";
    }

    .detail-heading {
      position: relative;
      z-index: 2;
      padding: 38px 38px 0;
    }

    .detail-category-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;
      color: rgba(255,255,255,.86);
      background: rgba(255,255,255,.10);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .detail-category-chip::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      content: "";
    }

    .detail-heading h1 {
      max-width: 690px;
      margin: 20px 0 0;
      font-size: clamp(42px, 5vw, 66px);
      font-weight: 820;
      letter-spacing: -.058em;
      line-height: .95;
    }

    .detail-heading p {
      margin: 15px 0 0;
      color: rgba(255,255,255,.72);
      font-size: 13px;
    }

    .detail-art-stage {
      position: absolute;
      z-index: 1;
      inset: 155px 20px 15px;
      display: grid;
      place-items: center;
    }

    .detail-art-stage .exercise-art {
      width: min(330px, 90%);
      height: min(330px, 100%);
      max-height: none;
      object-fit: cover;
      object-position: center;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 24px 44px rgba(44, 24, 117, .28);
      filter: none;
    }

    .detail-side {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-card,
    .input-card,
    .threshold-card {
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }

    .rank-card {
      --detail-accent: var(--brand);
      display: grid;
      min-height: 238px;
      grid-template-columns: 132px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 24px 22px;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 15% 22%, color-mix(in srgb, var(--detail-accent) 10%, transparent), transparent 12rem),
        #fff;
    }

    #detail-badge { width: 128px; max-width: 100%; }
    #detail-badge .rank-badge { width: 100%; height: auto; }

    .rank-card-copy { min-width: 0; }

    .rank-card-kicker,
    .input-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .rank-card-name {
      margin-top: 8px;
      color: var(--detail-accent);
      font-size: 24px;
      font-weight: 820;
      letter-spacing: -.04em;
      line-height: 1;
    }

    .rank-card-text {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 17px;
      overflow: hidden;
      border-radius: 999px;
      background: #eceaf0;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--progress-color, var(--detail-accent));
      transition: width .45s var(--ease), background .25s ease;
    }

    .input-card {
      flex: 1;
      padding: 25px;
      border-radius: 28px;
    }

    .input-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .big-value {
      margin-top: 9px;
      font-size: clamp(35px, 4vw, 48px);
      font-weight: 820;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }

    .stepper {
      display: flex;
      gap: 8px;
    }

    .step-button {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: var(--card-soft);
      font-size: 20px;
      font-weight: 600;
      transition: color .2s ease, background .2s ease, transform .18s ease;
    }

    .step-button:hover {
      color: #fff;
      background: var(--ink);
      transform: translateY(-2px);
    }

    .range-wrap { margin-top: 27px; }

    input[type="range"] {
      width: 100%;
      height: 9px;
      margin: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--slider-accent) var(--slider-progress), #ebe9ef var(--slider-progress));
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 28px;
      height: 28px;
      border: 6px solid #fff;
      border-radius: 50%;
      background: var(--slider-accent);
      box-shadow: 0 5px 18px color-mix(in srgb, var(--slider-accent) 35%, transparent), 0 0 0 1px rgba(31,28,43,.08);
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 6px solid #fff;
      border-radius: 50%;
      background: var(--slider-accent);
      box-shadow: 0 5px 18px color-mix(in srgb, var(--slider-accent) 35%, transparent), 0 0 0 1px rgba(31,28,43,.08);
    }

    .range-meta {
      display: grid;
      grid-template-columns: 1fr 102px 1fr;
      align-items: center;
      gap: 12px;
      margin-top: 19px;
    }

    .range-meta > span {
      color: var(--muted-2);
      font-size: 10px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .range-meta > span:last-child { text-align: right; }

    .number-field {
      width: 102px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--card-soft);
      text-align: center;
      font-size: 14px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .number-field::-webkit-inner-spin-button,
    .number-field::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .autosave-note {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 19px;
      color: var(--muted);
      font-size: 10px;
    }

    .autosave-note::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(31,166,117,.10);
      content: "";
    }

    .detail-bottom {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .threshold-card {
      padding: 29px;
      border-radius: 30px;
    }

    .journey-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 22px;
    }

    .journey-head h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .journey-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .journey-head::after {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--card-soft);
      font-size: 9px;
      font-weight: 720;
      content: "13 Level";
    }

    .threshold-list {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 9px;
    }

    .threshold {
      min-width: 0;
      padding: 14px 8px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card-soft);
      text-align: center;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .threshold.reached {
      border-color: color-mix(in srgb, var(--threshold-accent) 30%, var(--line));
      background: color-mix(in srgb, var(--threshold-accent) 7%, #fff);
    }

    .threshold.current {
      color: #fff;
      border-color: var(--threshold-accent);
      background: var(--threshold-accent);
      box-shadow: 0 10px 22px color-mix(in srgb, var(--threshold-accent) 25%, transparent);
      transform: translateY(-2px);
    }

    .threshold-rank {
      overflow: hidden;
      color: var(--muted);
      font-size: 8px;
      font-weight: 740;
      letter-spacing: .02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .threshold.current .threshold-rank { color: rgba(255,255,255,.76); }

    .threshold-value {
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
    }

    .threshold.current .threshold-value { color: #fff; }

    /* Modals */
    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(10, 8, 18, .72);
      backdrop-filter: blur(14px);
      animation: fade .22s ease both;
    }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .modal-panel {
      width: min(980px, 100%);
      max-height: min(820px, calc(100vh - 36px));
      overflow: auto;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: 0 38px 110px rgba(0,0,0,.45);
      animation: modalIn .3s var(--ease) both;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-head {
      position: sticky;
      z-index: 2;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 25px 27px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 810;
      letter-spacing: -.04em;
    }

    .modal-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 20px;
    }

    .rank-grid-item {
      display: flex;
      min-height: 176px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 10px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      text-align: center;
      transition: transform .22s var(--ease), box-shadow .2s ease;
    }

    .rank-grid-item:hover {
      box-shadow: var(--shadow-card);
      transform: translateY(-3px);
    }

    .rank-grid-item:last-child {
      grid-column: 2 / span 2;
      width: calc(50% - 6px);
      justify-self: center;
    }

    .rank-grid-item.active {
      border-color: color-mix(in srgb, var(--item-accent) 42%, var(--line));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--item-accent) 18%, transparent), var(--shadow-card);
    }

    .rank-grid-name {
      margin-top: 9px;
      color: var(--item-accent);
      font-size: 11px;
      font-weight: 820;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .rank-grid-level {
      margin-top: 4px;
      color: var(--muted-2);
      font-size: 9px;
      font-weight: 680;
    }

    /* Reset dialog */
    .reset-panel {
      width: min(440px, 100%);
      max-height: none;
      overflow: hidden;
    }

    .reset-body {
      padding: 34px 30px 24px;
      text-align: center;
    }

    .reset-symbol {
      display: grid;
      width: 60px;
      height: 60px;
      margin: 0 auto 19px;
      place-items: center;
      border-radius: 19px;
      color: var(--danger);
      background: rgba(216,76,87,.10);
    }

    .reset-symbol svg { width: 25px; height: 25px; }

    .reset-body h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 810;
      letter-spacing: -.04em;
    }

    .reset-body p {
      max-width: 350px;
      margin: 11px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .reset-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .quiet-button,
    .primary-button,
    .danger-button {
      min-height: 46px;
      padding: 0 18px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 760;
      transition: transform .2s var(--ease), box-shadow .2s ease, background .2s ease;
    }

    .quiet-button {
      border: 1px solid var(--line);
      color: var(--ink-soft);
      background: var(--card);
    }

    .primary-button {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 10px 22px rgba(114,87,247,.22);
    }

    .danger-button {
      color: #fff;
      background: var(--danger);
      box-shadow: 0 10px 22px rgba(216,76,87,.20);
    }

    .quiet-button:hover,
    .primary-button:hover,
    .danger-button:hover { transform: translateY(-2px); }

    .app-toast {
      position: fixed;
      z-index: 140;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      translate: -50% 14px;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #fff;
      background: rgba(22, 19, 31, .94);
      box-shadow: 0 18px 55px rgba(0,0,0,.36);
      font-size: 12px;
      font-weight: 680;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, translate .22s ease;
    }

    .app-toast.visible { opacity: 1; translate: -50% 0; }

    .footer-note {
      padding: 36px 8px 0;
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 1020px) {
      .home-hero { grid-template-columns: minmax(0, 1fr) 280px; padding: 34px; }
      .home-hero h1 { font-size: clamp(45px, 7vw, 66px); }
      .exercise-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-art-card { min-height: 430px; }
      .detail-side { display: grid; grid-template-columns: 1fr 1fr; }
      .threshold-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      body { background: var(--surface); }
      body::before { display: none; }

      .app {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding-right: max(15px, env(safe-area-inset-right));
        padding-left: max(15px, env(safe-area-inset-left));
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .topbar,
      .detail-top {
        min-height: 72px;
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .brand-sub { display: none; }
      .brand-name { font-size: 13px; }
      .brand-mark { width: 35px; height: 35px; border-radius: 12px; }
      .icon-button { width: 42px; height: 42px; }

      .home-hero {
        grid-template-columns: 1fr;
        min-height: auto;
        gap: 24px;
        padding: 28px 22px 22px;
        border-radius: 28px;
      }

      .home-hero h1 {
        margin-top: 20px;
        font-size: clamp(44px, 13vw, 60px);
      }

      .hero-description { font-size: 13px; }
      .hero-metrics { gap: 8px; margin-top: 23px; }
      .hero-metric { min-width: 0; flex: 1; padding: 12px 13px; }

      .overall-card {
        display: grid;
        min-height: 176px;
        grid-template-columns: minmax(0, 1fr) 132px;
        grid-template-rows: auto 1fr;
        align-items: center;
        gap: 8px 16px;
        padding: 19px;
        border-radius: 24px;
      }

      .overall-card-top { grid-column: 1 / -1; }
      .overall-ring { grid-column: 2; grid-row: 2; width: 126px; height: 126px; margin: 0; }
      .overall-ring-copy { width: 92px; height: 92px; }
      .overall-ring-copy strong { max-width: 80px; font-size: 15px; }
      .overall-card-foot { grid-column: 1; grid-row: 2; padding: 0; border: 0; text-align: left; }

      .exercise-section { padding-top: 22px; }
      .clean-tabs { border-radius: 20px; }
      .clean-tabs::before { border-radius: 15px; }
      .clean-tab { min-height: 50px; padding: 0 7px; border-radius: 15px; font-size: 12px; }

      .clean-section-head { margin: 28px 3px 14px; }
      .clean-section-head h2 { font-size: 27px; }
      .clean-section-head p { display: none; }
      .category-count { padding: 8px 10px; }

      .exercise-card {
        grid-template-columns: 96px minmax(0, 1fr) 52px 40px;
        min-height: 132px;
        gap: 12px;
        padding: 11px;
        border-radius: 22px;
      }

      .art-panel { width: 96px; height: 108px; border-radius: 18px; }
      .exercise-art { width: 93px; height: 93px; }
      .card-title { font-size: 17px; }
      .card-arrow { width: 40px; height: 40px; }

      .detail-top .brand { display: none; }
      .detail-grid { gap: 14px; }
      .detail-art-card { min-height: 390px; border-radius: 28px; }
      .detail-heading { padding: 29px 24px 0; }
      .detail-heading h1 { font-size: clamp(40px, 12vw, 56px); }
      .detail-art-stage { inset: 145px 6px 8px; }
      .detail-side { display: flex; }
      .rank-card, .input-card { border-radius: 25px; }
      .threshold-card { padding: 24px 17px; border-radius: 26px; }
      .journey-head h2 { font-size: 23px; }
      .threshold-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }

      .rank-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px; }
      .rank-grid-item { min-height: 152px; border-radius: 19px; }
      .rank-grid-item:last-child { grid-column: 2; width: 100%; }
      .modal { padding: 8px; }
      .modal-panel { max-height: calc(100vh - 16px); border-radius: 25px; }
      .modal-head { padding: 20px; }
    }

    @media (max-width: 520px) {
      .topbar { gap: 12px; }
      .top-actions { gap: 7px; }
      .home-hero { padding: 25px 18px 18px; }
      .home-hero h1 { font-size: clamp(39px, 12.5vw, 51px); }
      .hero-eyebrow { padding: 7px 9px; font-size: 9px; }
      .hero-description { line-height: 1.55; }
      .hero-metric strong { font-size: 18px; }
      .hero-metric span { font-size: 9px; }

      .overall-card {
        grid-template-columns: minmax(0,1fr) 112px;
        min-height: 158px;
        padding: 17px;
      }
      .overall-ring { width: 110px; height: 110px; }
      .overall-ring-copy { width: 80px; height: 80px; }
      .overall-ring-copy small { font-size: 8px; }
      .overall-ring-copy strong { max-width: 70px; font-size: 13px; }
      .overall-card-foot { font-size: 10px; }

      .clean-tab { font-size: 11px; }
      .clean-section-head h2 { font-size: 25px; }
      .category-kicker { font-size: 9px; }
      .category-count { font-size: 9px; }

      .exercise-card {
        grid-template-columns: 82px minmax(0, 1fr) 38px;
        min-height: 116px;
        gap: 11px;
        padding: 10px;
      }

      .art-panel { width: 82px; height: 96px; border-radius: 16px; }
      .exercise-art { width: 82px; height: 82px; }
      .card-badge { display: none; }
      .card-arrow { width: 38px; height: 38px; }
      .card-title { font-size: 15px; }
      .card-kicker { font-size: 8px; }
      .card-status { padding: 4px 6px; font-size: 7px; }
      .rank-label, .value-label { font-size: 9px; }
      .mini-progress { margin-top: 10px; height: 4px; }

      .detail-art-card { min-height: 350px; }
      .detail-heading { padding: 25px 20px 0; }
      .detail-heading h1 { font-size: 39px; }
      .detail-art-stage { inset: 140px 0 4px; }
      .rank-card { grid-template-columns: 102px minmax(0,1fr); gap: 7px; padding: 21px 16px; }
      #detail-badge { width: 98px; }
      .rank-card-name { font-size: 20px; }
      .rank-card-text { font-size: 11px; }
      .input-card { padding: 22px 18px; }
      .big-value { font-size: 36px; }
      .step-button { width: 40px; height: 40px; }
      .range-meta { grid-template-columns: 1fr 86px 1fr; }
      .number-field { width: 86px; }
      .journey-head { display: block; }

      height: 6px;

    .art-panel > .exercise-art {
      width: calc(100% - 8px);

    /* Die weiße PNG-Fläche wirkt jetzt wie eine absichtlich gesetzte
       Posterkarte in der rechten unteren Ecke – nicht mehr wie ein
       zufällig auf den violetten Hintergrund gelegtes Quadrat. */
    .detail-art-stage {
      position: absolute;
      z-index: 3;
      inset: auto -24px -24px auto;
      display: block;
      width: clamp(215px, 46%, 340px);
      height: auto;
      aspect-ratio: 1;
      pointer-events: none;
      transform: rotate(-1.5deg);
      transform-origin: 100% 100%;
    }

    .detail-art-stage::before {
      position: absolute;
      z-index: -1;
      inset: 13px 18px 18px -18px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 34px;
      background: rgba(255, 255, 255, .105);
      box-shadow: 0 22px 48px rgba(45, 26, 124, .16);
      content: "";
      transform: rotate(4deg);
    }

    .detail-art-stage .exercise-art {
      display: block;
      width: 100%;
      height: 100%;
      max-height: none;
      border: 8px solid #fff;
      border-radius: 32px;
      outline: 1px solid rgba(255, 255, 255, .48);
      object-fit: cover;
      object-position: center;
      background: #fff;
      box-shadow:
        0 32px 64px rgba(43, 24, 116, .34),
        0 8px 20px rgba(43, 24, 116, .18);
      filter: none;
      transform: none;
    }

    /* Switch selbst */
    .theme-toggle {
      position: relative;
      display: inline-grid;
      width: 54px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      box-shadow: 0 8px 22px rgba(31,25,62,.08);
      cursor: pointer;
      transition: background .28s var(--ease), border-color .28s ease, box-shadow .28s ease, transform .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:hover { transform: translateY(-1px); }
    .theme-toggle:active { transform: scale(.96); }

    .theme-toggle-track {
      position: absolute;
      inset: 4px;
      overflow: hidden;
      border-radius: inherit;
      background: #eeedf2;
      transition: background .32s var(--ease);
    }

    .theme-toggle-thumb {
      position: absolute;
      z-index: 2;
      top: 5px;
      left: 5px;
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 50%;
      color: #7257f7;
      background: #fff;
      box-shadow: 0 4px 12px rgba(31,25,62,.18);
      transform: translateX(0);
      transition: transform .38s var(--ease), color .28s ease, background .28s ease, box-shadow .28s ease;
    }

    .theme-toggle-thumb svg {
      position: absolute;
      width: 12px;
      height: 12px;
      transition: opacity .22s ease, transform .32s var(--ease);
    }

    .theme-sun { opacity: 1; transform: scale(1) rotate(0deg); }
    .theme-moon { opacity: 0; transform: scale(.55) rotate(-35deg); }

    html[data-theme="dark"] .theme-toggle {
      border-color: #303541;
      background: #171a22;
      box-shadow: 0 8px 22px rgba(0,0,0,.22);
    }

    html[data-theme="dark"] .theme-toggle-track { background: #252a34; }

    html[data-theme="dark"] .theme-toggle-thumb {
      color: #d7ccff;
      background: #7257f7;
      box-shadow: 0 5px 14px rgba(114,87,247,.32);
      transform: translateX(20px);
    }

    html[data-theme="dark"] .theme-sun { opacity: 0; transform: scale(.55) rotate(45deg); }
    html[data-theme="dark"] .theme-moon { opacity: 1; transform: scale(1) rotate(0deg); }

    @media (max-width: 520px) {
      .theme-toggle { width: 50px; height: 32px; }
      .theme-toggle-thumb { width: 20px; height: 20px; top: 5px; left: 5px; }
      html[data-theme="dark"] .theme-toggle-thumb { transform: translateX(18px); }
    }


    /* ===== Archetype · Journey · Road to Apex · Cinematic Rank Up ===== */
    .archetype-pill{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card-soft);font-size:8px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}

    .journey-stage{position:relative;padding:15px 8px 13px;border:1px solid var(--line);border-radius:17px;background:var(--card-soft);text-align:center;overflow:hidden}
    .journey-stage::before{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--stage);opacity:.16;content:""}
    .journey-stage.done::before,.journey-stage.current::before{opacity:1}
    .journey-stage.current{border-color:color-mix(in srgb,var(--stage) 42%,var(--line));box-shadow:0 10px 25px color-mix(in srgb,var(--stage) 12%,transparent);transform:translateY(-2px)}
    .journey-dot{display:grid;width:30px;height:30px;margin:0 auto 9px;place-items:center;border-radius:50%;color:var(--muted);background:var(--card);border:1px solid var(--line);font-size:9px;font-weight:850}

    .apex-copy h2{margin:5px 0 0;font-size:28px;letter-spacing:-.045em}.apex-copy p{margin:8px 0 0;color:rgba(255,255,255,.62);font-size:11px;line-height:1.5}
    .apex-track{height:8px;margin-top:19px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.12)}.apex-track span{display:block;height:100%;border-radius:inherit;background:#fff;box-shadow:0 0 18px rgba(255,255,255,.35)}
    .rankup-panel{position:relative}.rankup-panel::before{position:absolute;inset:-80px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--rankup-accent) 32%,transparent),transparent 34%);content:"";animation:rankAura 1.4s ease both;pointer-events:none}
    .rankup-badge{position:relative}.rankup-badge::after{position:absolute;inset:4%;border:1px solid color-mix(in srgb,var(--rankup-accent) 65%,#fff);border-radius:50%;content:"";animation:rankPulse 1.15s ease-out both;pointer-events:none}
    .rankup-meta{margin:18px auto 0;padding:11px 13px;max-width:290px;border:1px solid rgba(255,255,255,.10);border-radius:14px;color:rgba(255,255,255,.58);background:rgba(255,255,255,.045);font-size:9px;font-weight:700}

    /* ===== Bottom App Navigation ===== */
    .app.with-bottom-nav { padding-bottom: max(112px, calc(92px + env(safe-area-inset-bottom))); }
    .bottom-nav-shell {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      width: min(520px, calc(100% - 32px));
      transform: translateX(-50%);
      pointer-events: none;
    }
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 24px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 18px 48px rgba(23,18,48,.18);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      pointer-events: auto;
    }
    .bottom-nav-button {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 0;
      border-radius: 18px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 760;
      transition: color .2s ease, background .25s var(--ease), transform .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .bottom-nav-button svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .bottom-nav-button:hover { color: var(--ink); background: var(--card-soft); }
    .bottom-nav-button:active { transform: scale(.97); }
    .bottom-nav-button.active {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), #8b72ff);
      box-shadow: 0 8px 18px rgba(114,87,247,.24);
    }

    /* ===== Fortschritt-Ansicht ===== */
    /* Tab-Seiten dürfen keinen transformierten Elterncontainer haben:
       position: fixed der Bottom-Navigation bleibt dadurch wirklich am Viewport. */
    .tab-page { animation: tabPageFadeIn .35s ease both; }

    @keyframes tabPageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .tab-page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 4px 20px;
    }
    .tab-page-head h1 { margin: 6px 0 0; font-size: clamp(34px,5vw,48px); font-weight: 840; letter-spacing: -.055em; }
    .tab-page-head p { max-width: 620px; margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .progress-overview { display: grid; gap: 18px; }
    .progress-category { padding: 24px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); box-shadow: var(--shadow-card); }
    .progress-category-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:15px; }
    .progress-category-title { font-size: 22px; font-weight: 820; letter-spacing: -.04em; }
    .progress-category-meta { margin-top:5px; color:var(--muted); font-size:10px; }
    .progress-list { display:grid; gap:9px; }
    .progress-row {
      --row-accent: var(--brand);
      display:grid;
      grid-template-columns: 1fr auto;
      gap:14px;
      align-items:center;
      padding:14px 15px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--card-soft);
      cursor:pointer;
      transition:transform .2s var(--ease),border-color .2s ease,background .2s ease;
    }
    .progress-row:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--row-accent) 30%,var(--line)); }
    .progress-row-main { min-width:0; }
    .progress-row-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .progress-row-name { overflow:hidden; font-size:14px; font-weight:790; text-overflow:ellipsis; white-space:nowrap; }
    .progress-row-value { flex:0 0 auto; color:var(--muted); font-size:10px; font-weight:720; }
    .progress-row-rank { margin-top:5px; color:var(--row-accent); font-size:10px; font-weight:800; }
    .progress-row-bar { height:5px; margin-top:10px; overflow:hidden; border-radius:99px; background:#e7e5eb; }
    .progress-row-bar span { display:block; height:100%; border-radius:inherit; background:var(--row-accent); }

    .progress-row-next svg { width:14px; height:14px; }

    .apex-road-card {

        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);

    .apex-score-layout {

    .apex-score-orbit {
      --apex-progress: 0%;
      position: relative;
      display: grid;
      width: 168px;
      height: 168px;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle,#17131f 0 58%,transparent 59%),
        conic-gradient(#fff var(--apex-progress),rgba(255,255,255,.12) 0);

        inset 0 0 0 1px rgba(255,255,255,.13),
        0 24px 44px rgba(0,0,0,.27),
        0 0 52px rgba(114,87,247,.18);

      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      content: "";

      inset: -9px;
      border: 1px solid rgba(255,255,255,.10);

    .apex-score-orbit::after {
      top: -4px;

      height: 9px;

    /* ===== Dopamine Rank / PR Hit Moments ===== */
    .minimal-hit-modal {
      position: fixed;
      z-index: 220;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(8, 7, 13, .14);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      pointer-events: none;
      animation: hitBackdrop 1.95s ease both;
    }

    .minimal-hit-card {
      --hit-accent: var(--brand);
      position: relative;
      display: grid;
      justify-items: center;
      min-width: min(270px, calc(100vw - 42px));
      padding: 18px 22px 17px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 30px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--hit-accent) 15%,transparent), transparent 9rem),
        rgba(14,13,20,.93);
      box-shadow:
        0 30px 80px rgba(0,0,0,.32),
        0 0 52px color-mix(in srgb,var(--hit-accent) 14%,transparent);
      text-align: center;
      transform-origin: center;
      animation: hitCardDopamine 1.95s cubic-bezier(.2,.9,.22,1) both;
    }

    .minimal-hit-card::before {
      position: absolute;
      inset: 50%;
      width: 160px;
      height: 160px;
      border: 1px solid color-mix(in srgb,var(--hit-accent) 48%,transparent);
      border-radius: 50%;
      opacity: 0;
      content: "";
      transform: translate(-50%,-50%) scale(.25);
      animation: hitShockwave 1.2s ease-out .18s both;
      pointer-events: none;
    }

    .minimal-hit-badge {
      width: 138px;
      height: 138px;
      margin: -2px auto 1px;
      filter:
        drop-shadow(0 22px 34px rgba(0,0,0,.30))
        drop-shadow(0 0 20px color-mix(in srgb,var(--hit-accent) 34%,transparent));
      transform-origin: center;
      animation: hitBadgeLaunch 1.16s cubic-bezier(.18,.92,.22,1.18) both;
    }

    .minimal-hit-badge .rank-badge {
      width: 100%;
      height: 100%;
    }

    .minimal-hit-kicker {
      margin-top: 3px;
      color: rgba(255,255,255,.36);
      font-size: 7px;
      font-weight: 820;
      letter-spacing: .15em;
      text-transform: uppercase;
      opacity: 0;
      animation: hitTextIn .34s ease .46s forwards;
    }

    .minimal-hit-main {
      margin-top: 5px;
      color: #fff;
      font-size: 27px;
      font-weight: 920;
      letter-spacing: -.05em;
      line-height: 1;
      opacity: 0;
      transform: translateY(6px);
      animation: hitTextIn .38s ease .51s forwards;
    }

    .minimal-hit-sub {
      margin-top: 7px;
      color: rgba(255,255,255,.44);
      font-size: 9px;
      font-weight: 700;
      opacity: 0;
      animation: hitTextIn .34s ease .56s forwards;
    }

    .minimal-hit-pr-value {
      margin-top: 8px;
      color: var(--hit-accent);
      font-size: clamp(44px, 10vw, 60px);
      font-weight: 930;
      letter-spacing: -.075em;
      line-height: .88;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 26px color-mix(in srgb,var(--hit-accent) 24%,transparent);
      transform-origin: center;
      animation: hitPrLaunch 1.12s cubic-bezier(.18,.92,.22,1.18) both;
    }

    @keyframes hitBackdrop {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      78%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes hitCardDopamine {
      0%   { opacity: 0; transform: scale(.22) translateY(24px); filter: blur(7px); }
      18%  { opacity: 1; transform: scale(1.10) translateY(-3px); filter: blur(0); }
      30%  { transform: scale(.97) translateY(0); }
      40%  { transform: scale(1.02); }
      58%  { transform: scale(1); }
      78%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(.92) translateY(-10px); }
    }

    @keyframes hitBadgeLaunch {
      0%   { opacity: 0; transform: scale(.08) rotate(-9deg); }
      28%  { opacity: 1; transform: scale(1.18) rotate(2deg); }
      43%  { transform: scale(.92) rotate(-1deg); }
      58%  { transform: scale(1.055) rotate(.5deg); }
      72%  { transform: scale(1) rotate(0); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes hitPrLaunch {
      0%   { opacity: 0; transform: scale(.16); }
      30%  { opacity: 1; transform: scale(1.15); }
      48%  { transform: scale(.94); }
      64%  { transform: scale(1.035); }
      78%  { transform: scale(1); }
      100% { transform: scale(1); }
    }

    @keyframes hitShockwave {
      0%   { opacity: .72; transform: translate(-50%,-50%) scale(.28); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.7); }
    }

    @keyframes hitTextIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .minimal-hit-card,
      .minimal-hit-badge,
      .minimal-hit-pr-value,
      .minimal-hit-card::before {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
      }
      .minimal-hit-kicker,
      .minimal-hit-main,
      .minimal-hit-sub {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        opacity: 1 !important;
      }
    }

    /* =========================================================

    .account-card {
      position: relative;
      margin-top: 18px;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow-card);

    .account-card::after {
      position: absolute;
      width: 210px;
      height: 210px;
      top: -135px;
      right: -115px;

      border-radius: 50%;
      box-shadow: 0 0 0 34px color-mix(in srgb, var(--brand) 4%, transparent);
      content: "";
      pointer-events: none;

    .account-body,
    .account-user-row,
    .account-actions {
      position: relative;
      z-index: 1;
    }

    .account-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .account-head h2 {
      margin: 6px 0 0;
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -.05em;
    }

      font-size: 11px;
      line-height: 1.6;

    .account-pill {

      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      padding: 0 11px;

      font-size: 8px;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;

      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 12%, transparent);
      content: "";

    .account-pill.verified { color: var(--success); }
    .account-pill.pending { color: #d18a22; }

    .account-body { margin-top: 22px; }

    .account-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      max-width: 680px;
    }

    .account-code-form {
      grid-template-columns: minmax(0, 180px) auto;
    }

      height: 50px;
      padding: 0 15px;
      border: 1px solid var(--line);

    .account-secondary:hover,

    .account-secondary:disabled,
    .account-danger:disabled {

      cursor: wait;
      transform: none;
    }

      color: var(--muted);
      font-size: 9px;
      line-height: 1.55;

      border: 0;
      color: var(--brand);
      background: transparent;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;

      align-items: center;
      gap: 13px;
      margin-top: 22px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card-soft);
    }

    .account-user-icon {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border-radius: 16px;
      color: #fff;

      color: var(--muted);
      font-size: 9px;
    }

      color: var(--muted);
      background: var(--card);
      font-size: 8px;
      font-weight: 820;
      white-space: nowrap;
    }
    .account-sync-state.synced { color: var(--success); }

    .account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .friends-account-gate {

      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 22px;
    }

      margin: 6px 0 0;
      font-size: 25px;
      font-weight: 840;
      letter-spacing: -.045em;
    }

      max-width: 620px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    html[data-theme="dark"] .account-card,
    html[data-theme="dark"] .account-user-row {
      border-color: var(--line);
      background: var(--card);
    }

    html[data-theme="dark"] .account-input,
    html[data-theme="dark"] .account-secondary {
      color: var(--ink);
      border-color: var(--line);
      background: var(--card-soft);
    }

    @media (max-width: 620px) {
      .account-card { padding: 22px; border-radius: 24px; }
      .account-head { display: block; }
      .account-pill { margin-top: 13px; }
      .account-form,
      .account-code-form { grid-template-columns: 1fr; max-width: none; }
      .account-user-row { grid-template-columns: 45px minmax(0, 1fr); }
      .account-user-icon { width: 45px; height: 45px; border-radius: 14px; }
      .account-sync-state { grid-column: 1 / -1; justify-self: start; }
      .account-actions { display: grid; grid-template-columns: 1fr; }
      .friends-account-gate { grid-template-columns: 1fr; }
    }

  </style>

      const memoryAuthStorage = (() => {

      function readableBrowserStorage(storageName) {
        try {
          const storage = window[storageName];
          const testKey = "__calisthenx_storage_test__";
          storage.setItem(testKey, "1");
          storage.removeItem(testKey);

      function migrateLegacySupabaseSession(storage) {
        if (!storage) return;
        try {
          if (storage.getItem(SUPABASE_AUTH_STORAGE_KEY)) return;
          for (const legacyKey of LEGACY_SUPABASE_AUTH_STORAGE_KEYS) {
            const raw = storage.getItem(legacyKey);
            if (!raw) continue;
            storage.setItem(SUPABASE_AUTH_STORAGE_KEY, raw);
            storage.removeItem(legacyKey);
            break;
          }
        } catch (_) {}
      }

      function getAuthStorage() {
        const browserStorage = readableBrowserStorage("localStorage");
        if (browserStorage) {
          migrateLegacySupabaseSession(browserStorage);
          return browserStorage;

      function readLegacyBrowserState() {
        const storage = readableBrowserStorage("localStorage");
        if (!storage) return { name: "", profileImage: "", values: {}, history: {} };

        const readJsonObject = keys => {
          for (const key of keys) {
            try {
              const raw = storage.getItem(key);
              if (!raw) continue;
              const parsed = JSON.parse(raw);
              if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
            } catch (_) {}
          }
          return {};
        };

        let name = "";
        let profileImage = "";
        try { name = sanitizeName(storage.getItem("clastanic-athlete-profile-v1") || ""); } catch (_) {}
        try { profileImage = storage.getItem("clastanic-athlete-profile-image-v1") || ""; } catch (_) {}

        return {
          name,

          values: sanitizeValues(readJsonObject([
            "calisthenics-standards-v3",
            "calisthenics-standards-v2",
            "calisthenics-standards-v1",

          ])),

      function clearLegacyAppStorage() {
        [readableBrowserStorage("localStorage"), readableBrowserStorage("sessionStorage")]
          .filter(Boolean)
          .forEach(storage => {
            try {
              for (let index = storage.length - 1; index >= 0; index -= 1) {
                const key = storage.key(index);
                if (!key) continue;
                const isLegacy = LEGACY_APP_STORAGE_KEYS.has(key) ||
                  key.startsWith("calisthenics-standards-") ||
                  key.startsWith("clastanic-athlete-profile-") ||
                  key.startsWith("clastanic-progress-history-") ||
                  key.startsWith("clastanic-social-profile-") ||
                  key.startsWith("clastanic-theme-");

              }
            } catch (_) {}
          });

      function sanitizeValues(candidate) {
        const clean = {};
        if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return clean;
        const validIds = new Set(ALL_EXERCISES.map(exercise => exercise.id));
        Object.entries(candidate).forEach(([id, rawValue]) => {
          if (!validIds.has(id)) return;
          clean[id] = Math.max(0, Math.round(Number(rawValue) || 0));
        });
        return clean;
      }

      function sanitizeName(value) {
        return String(value || "").replace(/\s+/g, " ").trim().slice(0, 28);
      }

      function sanitizeHistory(candidate) {
        const clean = {};
        if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return clean;
        const validIds = new Set(ALL_EXERCISES.map(exercise => exercise.id));

        Object.entries(candidate).forEach(([id, entries]) => {
          if (!validIds.has(id) || !Array.isArray(entries)) return;
          const normalized = entries
            .map(entry => ({
              value: Math.max(0, Math.round(Number(entry?.value) || 0)),
              at: Math.max(1, Math.round(Number(entry?.at) || Date.now()))
            }))
            .filter(entry => entry.value > 0)
            .sort((a, b) => a.at - b.at);

          const seen = new Set();
          clean[id] = normalized.filter(entry => {
            const key = `${entry.value}:${entry.at}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          }).slice(-12);
        });
        return clean;
      }

      function mergeValues(remoteValues, guestValues) {
        const remote = sanitizeValues(remoteValues);
        const guest = sanitizeValues(guestValues);
        const merged = { ...remote };
        Object.entries(guest).forEach(([id, value]) => {
          if (!Object.prototype.hasOwnProperty.call(merged, id)) merged[id] = value;
          else merged[id] = Math.max(Number(merged[id]) || 0, value);
        });
        return merged;
      }

      function mergeHistory(remoteHistory, guestHistory) {
        const remote = sanitizeHistory(remoteHistory);
        const guest = sanitizeHistory(guestHistory);
        const result = {};
        const ids = new Set([...Object.keys(remote), ...Object.keys(guest)]);
        ids.forEach(id => {
          const seen = new Set();
          result[id] = [...(remote[id] || []), ...(guest[id] || [])]
            .sort((a, b) => a.at - b.at)
            .filter(entry => {
              const key = `${entry.value}:${entry.at}`;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            })
            .slice(-12);
        });
        return result;
      }

      function captureCurrentState() {
        return {
          name: sanitizeName(state.name),
          profileImage: state.profileImage || "",
          values: sanitizeValues(state.values),
          history: sanitizeHistory(state.history)
        };
      }

      function saveValues() {
        state.values = sanitizeValues(state.values);
        queueAccountSync();

      function saveProfileName(name) {

        queueAccountSync();

      function saveProfileImage(dataUrl) {

      function saveHistory() {
